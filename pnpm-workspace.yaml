packages:
  - 'apps/*'
  - 'packages/*'
onlyBuiltDependencies:
  - '@nestjs/core'
  - '@prisma/client'
  - '@prisma/engines'
  - prisma
ignoredBuiltDependencies:
  - '@google/genai'
  - '@parcel/watcher'
  - '@swc/core'
  - esbuild
  - protobufjs
  - sharp
  - unrs-resolver
allowBuilds:
  '@google/genai': false
  '@nestjs/core': true
  '@parcel/watcher': false
  '@prisma/client': true
  '@prisma/engines': true
  '@swc/core': false
  esbuild: false
  prisma: true
  protobufjs: false
  sharp: false
  unrs-resolver: false
