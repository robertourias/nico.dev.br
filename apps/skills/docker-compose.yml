# Compose de PRODUÇÃO para o site estático skills.nico.dev.br na VPS.
#
# Traefik nesta VPS roda com `network_mode: host` (mesma VPS de `apps/api`, ver
# `apps/api/docker-compose.prod.example.yml`) — não tem rede bridge própria, então
# não dá (nem precisa) `docker network connect` nele: host-mode já alcança a IP de
# qualquer container em qualquer bridge network do Docker via rota do kernel. Por
# isso o label `traefik.docker.network` abaixo é obrigatório: sem ele, e como este
# serviço pode acabar em mais de uma rede (ex. rede padrão do projeto compose +
# outra futura), a escolha de qual IP rotear fica ambígua.
#
# Build + subida (na raiz do monorepo, contexto = raiz):
#   docker compose -f apps/skills/docker-compose.yml up -d --build
#
# Ver docs/specs/2026-09-29-skills-deploy-vps.md (T2) para o runbook completo do
# primeiro deploy.

services:
  skills:
    build:
      context: ../..
      dockerfile: apps/skills/Dockerfile
      args:
        SKILLS_REF: ${SKILLS_REF:-e137566fc94a63c3708cc720cfa62cadc73ab5ff}
    image: nico-skills:latest
    container_name: skills-web
    restart: unless-stopped
    # Sem `ports:` — Traefik (host-mode) alcança o container direto pela IP da rede
    # Docker indicada no label abaixo, sem precisar publicar porta pro host/internet.
    # Sem `environment:`/`.env` — site 100% estático, nenhuma variável em runtime.
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.nico-skills.rule=Host(`skills.nico.dev.br`)'
      - 'traefik.http.routers.nico-skills.entrypoints=websecure'
      - 'traefik.http.routers.nico-skills.tls.certresolver=letsencrypt'
      - 'traefik.http.services.nico-skills.loadbalancer.server.port=80'
      # Nome real da rede no Docker (prefixo do projeto compose, não uma chave
      # declarada aqui — este arquivo não declara `networks:` customizada, então o
      # compose cria a rede padrão `<nome-do-diretório-do-projeto>_default`).
      # Confirmar o valor real com:
      #   docker inspect skills-web --format '{{json .NetworkSettings.Networks}}'
      # depois do primeiro `up`, e ajustar este label se divergir (mesmo aviso já
      # registrado em apps/api/docker-compose.prod.example.yml).
      - 'traefik.docker.network=skills_default'
