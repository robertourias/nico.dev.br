# EXEMPLO de referência para o compose de PRODUÇÃO na VPS — não é usado por nenhum
# comando automatizado deste repo (deploy na VPS ainda é manual, ver T-05/T-07 de
# docs/plans/2026-06-25-api-claps-backend.md). Copie/adapte na VPS, não aqui.
#
# Premissa (confirmada com Beto): Postgres e Redis JÁ EXISTEM na VPS, cada um no seu
# próprio stack/rede (`postgres_default`, `redis_default` — não compartilham rede
# entre si). Este compose NÃO cria containers novos de Postgres/Redis — só conecta
# o `api` às redes já existentes como `external`, falando com elas pelos nomes de
# serviço de sempre (`postgres`, `redis`).
#
# Traefik nesta VPS roda com `network_mode: host` (confirmado via
# `docker inspect <container-traefik> --format '{{.HostConfig.NetworkMode}}'`) —
# não tem rede bridge própria, então NÃO dá (nem precisa) `docker network connect`
# nele: host-mode já alcança a IP de qualquer container em qualquer bridge network
# do Docker via rota do kernel. Tentar conectar uma rede a ele falha com
# "container sharing network namespace with another container or host cannot be
# connected to any other network".
#
# Como o `api` está em 3 redes (`api-network`, `postgres_default`, `redis_default`),
# o label `traefik.docker.network` abaixo é obrigatório pra dizer ao Traefik qual
# IP usar pra rotear — sem ele a escolha é ambígua. Os demais labels seguem a mesma
# convenção já usada em produção (confirmada via `minio` e `minuto-estoico-api`):
# `traefik.http.routers.*`, `entrypoints=websecure`, `certresolver=letsencrypt`.
#
# Variáveis sensíveis (DATABASE_URL, REDIS_URL, CLAPS_API_SECRET) vêm de um `.env`
# na VPS, fora do controle de versão — os valores abaixo são só placeholders.
# DATABASE_URL/REDIS_URL devem apontar para os nomes dos containers existentes
# (ex.: postgres://<user>:<senha>@postgres:5432/claps e redis://:<senha>@redis:6379)
# — ao trocar a senha do Postgres/Redis, atualize a connection string aqui também,
# os dois valores não são sincronizados automaticamente.

networks:
  api-network:
    driver: bridge
  postgres_default:
    external: true
  redis_default:
    external: true

services:
  api:
    image: nico-api:latest # build local ou de um registry privado
    restart: unless-stopped
    networks:
      - api-network # rede própria deste stack
      - postgres_default
      - redis_default
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      CLAPS_API_SECRET: ${CLAPS_API_SECRET}
      NODE_ENV: production
      PORT: 3001
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.nico-api.rule=Host(`api.nico.dev.br`)'
      - 'traefik.http.routers.nico-api.entrypoints=websecure'
      - 'traefik.http.routers.nico-api.tls.certresolver=letsencrypt'
      - 'traefik.http.services.nico-api.loadbalancer.server.port=3001'
      # Nome real da rede no Docker (prefixo do projeto compose, não a chave `api-network`
      # declarada acima) — confirmado via `docker inspect api-api-1`. Se o projeto for
      # criado com outro nome de pasta/--project-name, ajuste o prefixo.
      - 'traefik.docker.network=api_api-network' # desambigua: api está em 3 redes, Traefik (host-mode) precisa saber qual IP usar
    # Sem `ports:` — Traefik (host-mode) alcança o container direto pela IP da rede
    # Docker indicada no label acima, sem precisar publicar porta pro host/internet.
