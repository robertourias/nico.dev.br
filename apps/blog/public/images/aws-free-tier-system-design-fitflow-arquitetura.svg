<svg viewBox="0 0 1340 1000" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4338ca"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1340" height="1000" fill="#ffffff"/>
  <rect x="10" y="10" width="1320" height="980" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text x="660" y="45" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">FitFlow — arquitetura na AWS</text>
  <text x="660" y="68" text-anchor="middle" font-size="13" fill="#64748b">Next.js · React Native · API (Go/Node) · Postgres · Redis · ECS Fargate</text>

  <!-- Row A: clientes -->
  <rect x="140" y="95" width="300" height="65" rx="10" fill="#334155"/>
  <text x="290" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Next.js (Web)</text>
  <text x="290" y="142" text-anchor="middle" font-size="12" fill="#cbd5e1">monta e acompanha plano de treino</text>

  <rect x="900" y="95" width="300" height="65" rx="10" fill="#334155"/>
  <text x="1050" y="122" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">React Native (App)</text>
  <text x="1050" y="142" text-anchor="middle" font-size="12" fill="#cbd5e1">registra treino, sobe foto</text>

  <!-- Row B: CloudFront -->
  <rect x="520" y="235" width="300" height="65" rx="10" fill="#7c3aed"/>
  <text x="670" y="262" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">CloudFront (CDN)</text>
  <text x="670" y="282" text-anchor="middle" font-size="12" fill="#ede9fe">cache de assets, imagem e GET</text>

  <!-- Row C: ALB -->
  <rect x="520" y="375" width="300" height="65" rx="10" fill="#e11d48"/>
  <text x="670" y="402" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Application Load Balancer</text>
  <text x="670" y="422" text-anchor="middle" font-size="12" fill="#fecdd3">distribui tráfego entre os containers</text>

  <!-- Row D: ECS Fargate -->
  <rect x="230" y="515" width="320" height="65" rx="10" fill="#0f766e"/>
  <text x="390" y="542" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">ECS Fargate — API (Go/Node)</text>
  <text x="390" y="562" text-anchor="middle" font-size="12" fill="#ccfbf1">regra de negócio, autenticação</text>

  <rect x="790" y="515" width="320" height="65" rx="10" fill="#0f766e"/>
  <text x="950" y="542" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">ECS Fargate — Next.js SSR</text>
  <text x="950" y="562" text-anchor="middle" font-size="12" fill="#ccfbf1">renderiza tela autenticada</text>

  <!-- Row E: RDS, Redis, S3 -->
  <rect x="60" y="655" width="280" height="65" rx="10" fill="#2563eb"/>
  <text x="200" y="682" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">RDS Postgres</text>
  <text x="200" y="702" text-anchor="middle" font-size="12" fill="#dbeafe">usuário, plano, treino</text>

  <rect x="530" y="655" width="280" height="65" rx="10" fill="#dc2626"/>
  <text x="670" y="682" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">ElastiCache (Redis)</text>
  <text x="670" y="702" text-anchor="middle" font-size="12" fill="#fee2e2">cache de plano e dashboard</text>

  <rect x="1000" y="655" width="280" height="65" rx="10" fill="#f59e0b"/>
  <text x="1140" y="682" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">S3</text>
  <text x="1140" y="702" text-anchor="middle" font-size="12" fill="#fffbeb">fotos de treino, anexos</text>

  <!-- Row F: CloudWatch -->
  <rect x="380" y="795" width="580" height="65" rx="10" fill="#4338ca"/>
  <text x="670" y="822" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">CloudWatch</text>
  <text x="670" y="842" text-anchor="middle" font-size="12" fill="#e0e7ff">logs, métricas e alarmes de ALB, ECS, RDS e Redis</text>

  <!-- Arrows: fluxo síncrono principal -->
  <line x1="330" y1="160" x2="600" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1010" y1="160" x2="740" y2="235" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="300" x2="670" y2="375" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="620" y1="440" x2="420" y2="515" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="440" x2="920" y2="515" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="470" font-size="11" fill="#475569">via ALB</text>

  <line x1="330" y1="580" x2="220" y2="655" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="580" x2="640" y2="655" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="580" x2="720" y2="655" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="470" y="620" font-size="11" fill="#475569">cache</text>

  <!-- Upload direto pro S3 (laranja, presigned URL) -->
  <path d="M 1180 160 L 1260 160 L 1260 687 L 1220 687" stroke="#c2410c" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="1275" y="423" font-size="11" fill="#c2410c" transform="rotate(-90 1275,423)" text-anchor="middle">upload direto — presigned URL</text>

  <!-- Monitoramento (indigo, tracejado) -->
  <path d="M 670 440 L 670 795" stroke="#4338ca" stroke-width="2" stroke-dasharray="3,5" fill="none" marker-end="url(#arrowIndigo)"/>
  <path d="M 390 580 L 390 780 L 380 795" stroke="#4338ca" stroke-width="2" stroke-dasharray="3,5" fill="none" marker-end="url(#arrowIndigo)"/>
  <path d="M 950 580 L 950 780 L 960 795" stroke="#4338ca" stroke-width="2" stroke-dasharray="3,5" fill="none" marker-end="url(#arrowIndigo)"/>
  <path d="M 200 720 L 200 760 L 380 810" stroke="#4338ca" stroke-width="2" stroke-dasharray="3,5" fill="none" marker-end="url(#arrowIndigo)"/>

  <!-- Legend -->
  <g transform="translate(60,940)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#475569"/>
    <text x="22" y="13" font-size="12" fill="#334155">fluxo síncrono (leitura/escrita)</text>
  </g>
  <g transform="translate(330,940)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#c2410c"/>
    <text x="22" y="13" font-size="12" fill="#334155">upload de imagem (direto pro S3)</text>
  </g>
  <g transform="translate(630,940)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#4338ca"/>
    <text x="22" y="13" font-size="12" fill="#334155">logs e métricas (CloudWatch)</text>
  </g>
  <g transform="translate(880,940)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#0f766e"/>
    <text x="22" y="13" font-size="12" fill="#334155">containers (ECS Fargate)</text>
  </g>
  <g transform="translate(1100,940)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#f59e0b"/>
    <text x="22" y="13" font-size="12" fill="#334155">armazenamento (S3)</text>
  </g>
</svg>
