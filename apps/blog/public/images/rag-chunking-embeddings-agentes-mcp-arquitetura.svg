<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 370" font-family="'Inter', 'Segoe UI', sans-serif">
  <defs>
    <marker id="ar-arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888898"/>
    </marker>
    <marker id="ar-arr-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8c547"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="370" fill="#0a0a0f"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#f0efe8">RAG como ferramenta: agente + servidor MCP</text>

  <!-- container servidor -->
  <rect x="250" y="70" width="680" height="190" rx="14" fill="none" stroke="#ffffff14" stroke-dasharray="5 4"/>
  <text x="270" y="92" font-size="11" fill="#888898">lado do servidor: qualquer cliente MCP reutiliza</text>

  <!-- agente -->
  <rect x="20" y="120" width="150" height="110" rx="12" fill="#111118" stroke="#7b61ff" stroke-width="1.5"/>
  <text x="95" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#a78bfa">Agente</text>
  <text x="95" y="172" text-anchor="middle" font-size="11" fill="#888898">cliente MCP</text>
  <text x="95" y="188" text-anchor="middle" font-size="11" fill="#888898">(ex.: Claude Code)</text>
  <text x="95" y="212" text-anchor="middle" font-size="10" fill="#e8c547">decide quando buscar</text>

  <!-- servidor -->
  <rect x="270" y="120" width="190" height="110" rx="12" fill="#111118" stroke="#e8c547" stroke-width="1.5"/>
  <text x="365" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#e8c547">Servidor MCP</text>
  <text x="365" y="176" text-anchor="middle" font-size="11" fill="#f0efe8">tool: search_docs</text>
  <text x="365" y="196" text-anchor="middle" font-size="10" fill="#888898">query, limit → trechos</text>
  <text x="365" y="212" text-anchor="middle" font-size="10" fill="#888898">com a fonte de cada um</text>

  <!-- indice -->
  <rect x="560" y="120" width="150" height="110" rx="12" fill="#0f766e" fill-opacity="0.18" stroke="#0f766e" stroke-width="1.5"/>
  <text x="635" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#2dd4bf">Índice</text>
  <text x="635" y="176" text-anchor="middle" font-size="11" fill="#888898">chunks +</text>
  <text x="635" y="192" text-anchor="middle" font-size="11" fill="#888898">embeddings</text>

  <!-- docs -->
  <rect x="810" y="120" width="110" height="110" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="865" y="150" text-anchor="middle" font-size="12" font-weight="700" fill="#f0efe8">Docs</text>
  <text x="865" y="176" text-anchor="middle" font-size="11" fill="#888898">markdown</text>
  <text x="865" y="192" text-anchor="middle" font-size="11" fill="#888898">do time</text>

  <!-- arrows agente <-> servidor -->
  <line x1="172" y1="158" x2="268" y2="158" stroke="#e8c547" stroke-width="1.5" marker-end="url(#ar-arr-y)"/>
  <text x="220" y="150" text-anchor="middle" font-size="10" fill="#e8c547">tool call</text>
  <line x1="268" y1="196" x2="172" y2="196" stroke="#888898" stroke-width="1.5" marker-end="url(#ar-arr-g)"/>
  <text x="220" y="214" text-anchor="middle" font-size="10" fill="#888898">trechos</text>

  <!-- arrows servidor <-> indice -->
  <line x1="462" y1="158" x2="558" y2="158" stroke="#888898" stroke-width="1.5" marker-end="url(#ar-arr-g)"/>
  <text x="510" y="150" text-anchor="middle" font-size="10" fill="#888898">busca top-k</text>
  <line x1="558" y1="196" x2="462" y2="196" stroke="#888898" stroke-width="1.5" marker-end="url(#ar-arr-g)"/>
  <text x="510" y="214" text-anchor="middle" font-size="10" fill="#888898">vizinhos</text>

  <!-- docs -> indice -->
  <line x1="808" y1="175" x2="712" y2="175" stroke="#888898" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar-arr-g)"/>
  <text x="760" y="167" text-anchor="middle" font-size="10" fill="#888898">indexação</text>

  <!-- notas -->
  <text x="95" y="252" text-anchor="middle" font-size="10" fill="#888898">0, 1 ou N chamadas</text>
  <text x="470" y="298" text-anchor="middle" font-size="11" fill="#888898">o MCP padroniza como a ferramenta é descrita e chamada</text>
  <text x="470" y="318" text-anchor="middle" font-size="11" fill="#888898">a qualidade da resposta continua vindo de chunking, embeddings e busca</text>
</svg>
