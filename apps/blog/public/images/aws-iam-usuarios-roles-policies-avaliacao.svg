<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'Inter', 'Segoe UI', sans-serif">
  <defs>
    <marker id="iam-aval-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888898"/>
    </marker>
  </defs>
  <rect width="900" height="380" fill="#0a0a0f"/>
  <text x="30" y="46" font-size="20" font-weight="700" fill="#f0efe8">Como a AWS decide: permitir ou negar</text>

  <rect x="30" y="110" width="170" height="70" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="115" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#f0efe8">Requisição</text>
  <text x="115" y="160" text-anchor="middle" font-size="11" fill="#888898">principal + ação + recurso</text>

  <rect x="270" y="110" width="200" height="70" rx="12" fill="#111118" stroke="#7b61ff"/>
  <text x="370" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#f0efe8">1. Existe Deny explícito?</text>
  <text x="370" y="160" text-anchor="middle" font-size="11" fill="#a78bfa">qualquer policy aplicável</text>

  <rect x="520" y="110" width="170" height="70" rx="12" fill="#111118" stroke="#7b61ff"/>
  <text x="605" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#f0efe8">2. Existe Allow?</text>
  <text x="605" y="160" text-anchor="middle" font-size="11" fill="#a78bfa">que cubra a requisição</text>

  <rect x="740" y="110" width="130" height="70" rx="12" fill="#111118" stroke="#0f766e" stroke-width="2"/>
  <text x="805" y="140" text-anchor="middle" font-size="13" font-weight="700" fill="#2dd4bf">Permitido</text>
  <text x="805" y="160" text-anchor="middle" font-size="11" fill="#888898">requisição segue</text>

  <rect x="270" y="260" width="200" height="70" rx="12" fill="#111118" stroke="#e8c547" stroke-width="2"/>
  <text x="370" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#e8c547">Negado</text>
  <text x="370" y="310" text-anchor="middle" font-size="11" fill="#888898">Deny explícito vence tudo</text>

  <rect x="520" y="260" width="170" height="70" rx="12" fill="#111118" stroke="#e8c547" stroke-width="2"/>
  <text x="605" y="290" text-anchor="middle" font-size="13" font-weight="700" fill="#e8c547">Negado</text>
  <text x="605" y="310" text-anchor="middle" font-size="11" fill="#888898">deny implícito: sem Allow</text>

  <line x1="200" y1="145" x2="268" y2="145" stroke="#888898" stroke-width="2" marker-end="url(#iam-aval-arrow)"/>
  <line x1="470" y1="145" x2="518" y2="145" stroke="#888898" stroke-width="2" marker-end="url(#iam-aval-arrow)"/>
  <text x="494" y="136" text-anchor="middle" font-size="11" fill="#f0efe8">não</text>
  <line x1="690" y1="145" x2="738" y2="145" stroke="#888898" stroke-width="2" marker-end="url(#iam-aval-arrow)"/>
  <text x="714" y="136" text-anchor="middle" font-size="11" fill="#f0efe8">sim</text>
  <line x1="370" y1="180" x2="370" y2="258" stroke="#888898" stroke-width="2" marker-end="url(#iam-aval-arrow)"/>
  <text x="384" y="224" font-size="11" fill="#f0efe8">sim</text>
  <line x1="605" y1="180" x2="605" y2="258" stroke="#888898" stroke-width="2" marker-end="url(#iam-aval-arrow)"/>
  <text x="619" y="224" font-size="11" fill="#f0efe8">não</text>

  <text x="30" y="362" font-size="12" fill="#888898">Tudo começa negado. Só um Allow libera. Um Deny sempre vence.</text>
</svg>
