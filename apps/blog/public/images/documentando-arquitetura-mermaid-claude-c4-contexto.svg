<svg viewBox="0 0 800 470" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#888898"/>
    </marker>
  </defs>

  <rect width="800" height="470" fill="#0a0a0f"/>

  <text x="400" y="32" text-anchor="middle" fill="#f0efe8" font-size="20" font-weight="700">Contexto do Sistema: FitFlow</text>

  <!-- Usuario -->
  <rect x="300" y="56" width="200" height="72" rx="14" fill="#111118" stroke="#ffffff14"/>
  <text x="400" y="80" text-anchor="middle" fill="#888898" font-size="10">[Pessoa]</text>
  <text x="400" y="98" text-anchor="middle" fill="#f0efe8" font-size="14" font-weight="700">Usuário</text>
  <text x="400" y="116" text-anchor="middle" fill="#888898" font-size="10">treina e registra treinos</text>

  <!-- FitFlow -->
  <rect x="300" y="196" width="200" height="82" rx="14" fill="#e8c547" fill-opacity="0.1" stroke="#e8c547" stroke-width="1.5"/>
  <text x="400" y="220" text-anchor="middle" fill="#e8c547" font-size="10">[Sistema]</text>
  <text x="400" y="240" text-anchor="middle" fill="#e8c547" font-size="15" font-weight="700">FitFlow</text>
  <text x="400" y="260" text-anchor="middle" fill="#888898" font-size="10">app de tracking de treinos</text>

  <!-- WhatsApp -->
  <rect x="110" y="356" width="200" height="72" rx="14" fill="#111118" stroke="#888898" stroke-dasharray="5 4"/>
  <text x="210" y="380" text-anchor="middle" fill="#888898" font-size="10">[Sistema externo]</text>
  <text x="210" y="398" text-anchor="middle" fill="#f0efe8" font-size="14" font-weight="700">WhatsApp</text>
  <text x="210" y="416" text-anchor="middle" fill="#888898" font-size="10">notificações e lembretes</text>

  <!-- Auth -->
  <rect x="490" y="356" width="200" height="72" rx="14" fill="#111118" stroke="#888898" stroke-dasharray="5 4"/>
  <text x="590" y="380" text-anchor="middle" fill="#888898" font-size="10">[Sistema externo]</text>
  <text x="590" y="398" text-anchor="middle" fill="#f0efe8" font-size="14" font-weight="700">Auth Provider</text>
  <text x="590" y="416" text-anchor="middle" fill="#888898" font-size="10">autenticação OAuth</text>

  <!-- Arrows -->
  <line x1="400" y1="128" x2="400" y2="192" stroke="#888898" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="414" y="158" fill="#888898" font-size="11">Registra treinos,</text>
  <text x="414" y="173" fill="#888898" font-size="11">consulta progresso</text>

  <line x1="350" y1="278" x2="240" y2="352" stroke="#888898" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="270" y="316" text-anchor="end" fill="#888898" font-size="11">Envia lembretes via API</text>

  <line x1="450" y1="278" x2="560" y2="352" stroke="#888898" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="530" y="316" fill="#888898" font-size="11">Autentica usuário</text>

  <text x="400" y="456" text-anchor="middle" fill="#888898" font-size="10">tracejado = sistema externo</text>
</svg>
