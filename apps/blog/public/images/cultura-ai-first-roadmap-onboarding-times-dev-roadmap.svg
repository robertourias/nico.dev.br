<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" font-family="'Inter', 'Segoe UI', sans-serif">
  <defs>
    <marker id="rm-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888898"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="350" fill="#0a0a0f"/>
  <text x="460" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#f0efe8">Roadmap de cultura AI First em quatro fases</text>
  <text x="460" y="52" text-anchor="middle" font-size="12" fill="#888898">cada fase termina por critério de saída, não por data</text>

  <!-- fase 1 -->
  <rect x="20" y="150" width="205" height="170" rx="14" fill="#111118" stroke="#ffffff14"/>
  <text x="122" y="176" text-anchor="middle" font-size="13" font-weight="700" fill="#f0efe8">1 · Fundação</text>
  <text x="122" y="202" text-anchor="middle" font-size="11" fill="#888898">diagnosticar testes, CI,</text>
  <text x="122" y="218" text-anchor="middle" font-size="11" fill="#888898">revisão e docs</text>
  <text x="122" y="234" text-anchor="middle" font-size="11" fill="#888898">escrever política de uso</text>
  <text x="122" y="262" text-anchor="middle" font-size="10" font-weight="700" fill="#e8c547">SAÍDA</text>
  <text x="122" y="278" text-anchor="middle" font-size="11" fill="#e8c547">política escrita e</text>
  <text x="122" y="294" text-anchor="middle" font-size="11" fill="#e8c547">baseline de métricas</text>

  <line x1="227" y1="220" x2="243" y2="220" stroke="#888898" stroke-width="1.5" marker-end="url(#rm-arr)"/>

  <!-- fase 2 -->
  <rect x="245" y="120" width="205" height="170" rx="14" fill="#111118" stroke="#7b61ff" stroke-width="1.5"/>
  <text x="347" y="146" text-anchor="middle" font-size="13" font-weight="700" fill="#a78bfa">2 · Piloto</text>
  <text x="347" y="172" text-anchor="middle" font-size="11" fill="#888898">1 equipe, 1 fluxo,</text>
  <text x="347" y="188" text-anchor="middle" font-size="11" fill="#888898">com champions e dono</text>
  <text x="347" y="204" text-anchor="middle" font-size="11" fill="#888898">erros compartilhados</text>
  <text x="347" y="232" text-anchor="middle" font-size="10" font-weight="700" fill="#e8c547">SAÍDA</text>
  <text x="347" y="248" text-anchor="middle" font-size="11" fill="#e8c547">fluxo rodando e</text>
  <text x="347" y="264" text-anchor="middle" font-size="11" fill="#e8c547">aprendizados escritos</text>

  <line x1="452" y1="190" x2="468" y2="190" stroke="#888898" stroke-width="1.5" marker-end="url(#rm-arr)"/>

  <!-- fase 3 -->
  <rect x="470" y="90" width="205" height="170" rx="14" fill="#111118" stroke="#e8c547" stroke-width="1.5"/>
  <text x="572" y="116" text-anchor="middle" font-size="13" font-weight="700" fill="#e8c547">3 · Padronizar</text>
  <text x="572" y="142" text-anchor="middle" font-size="11" fill="#888898">contexto no repositório,</text>
  <text x="572" y="158" text-anchor="middle" font-size="11" fill="#888898">skills e comandos,</text>
  <text x="572" y="174" text-anchor="middle" font-size="11" fill="#888898">quality gates</text>
  <text x="572" y="202" text-anchor="middle" font-size="10" font-weight="700" fill="#e8c547">SAÍDA</text>
  <text x="572" y="218" text-anchor="middle" font-size="11" fill="#e8c547">novo membro segue o</text>
  <text x="572" y="234" text-anchor="middle" font-size="11" fill="#e8c547">fluxo lendo o repo</text>

  <line x1="677" y1="160" x2="693" y2="160" stroke="#888898" stroke-width="1.5" marker-end="url(#rm-arr)"/>

  <!-- fase 4 -->
  <rect x="695" y="60" width="205" height="170" rx="14" fill="#0f766e" fill-opacity="0.18" stroke="#0f766e" stroke-width="1.5"/>
  <text x="797" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#2dd4bf">4 · Escalar e medir</text>
  <text x="797" y="112" text-anchor="middle" font-size="11" fill="#888898">fluxo a fluxo, com</text>
  <text x="797" y="128" text-anchor="middle" font-size="11" fill="#888898">demos semanais e</text>
  <text x="797" y="144" text-anchor="middle" font-size="11" fill="#888898">métricas de entrega</text>
  <text x="797" y="172" text-anchor="middle" font-size="10" font-weight="700" fill="#e8c547">SAÍDA</text>
  <text x="797" y="188" text-anchor="middle" font-size="11" fill="#e8c547">prática revisada e</text>
  <text x="797" y="204" text-anchor="middle" font-size="11" fill="#e8c547">podada com frequência</text>
</svg>
