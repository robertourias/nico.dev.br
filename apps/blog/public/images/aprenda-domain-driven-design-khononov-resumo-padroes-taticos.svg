<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="560" fill="#ffffff"/>
  <rect x="10" y="10" width="1180" height="540" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text x="600" y="45" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Espectro de padrões de design tático</text>
  <text x="600" y="68" text-anchor="middle" font-size="13" fill="#64748b">a complexidade do padrão deve crescer junto com a complexidade real do subdomínio</text>

  <!-- spectrum bar -->
  <rect x="80" y="100" width="1040" height="10" rx="5" fill="url(#spectrum)"/>
  <text x="80" y="90" font-size="12" fill="#64748b">baixa complexidade</text>
  <text x="1120" y="90" text-anchor="end" font-size="12" fill="#64748b">alta complexidade</text>

  <!-- 4 pattern cards -->
  <g>
    <rect x="60" y="150" width="240" height="330" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="180" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Transaction Script</text>
    <text x="180" y="215" text-anchor="middle" font-size="11" fill="#475569">procedimento único</text>
    <text x="180" y="232" text-anchor="middle" font-size="11" fill="#475569">executa a regra do começo</text>
    <text x="180" y="249" text-anchor="middle" font-size="11" fill="#475569">ao fim, sem objeto de domínio</text>
    <line x1="90" y1="270" x2="270" y2="270" stroke="#cbd5e1" stroke-width="1"/>
    <text x="180" y="295" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Quando usar</text>
    <text x="180" y="315" text-anchor="middle" font-size="11" fill="#475569">regra de negócio simples,</text>
    <text x="180" y="332" text-anchor="middle" font-size="11" fill="#475569">poucas transições de estado</text>
    <text x="180" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#334155">Exemplo</text>
    <text x="180" y="380" text-anchor="middle" font-size="11" fill="#475569">calcular frete por CEP</text>
  </g>

  <g>
    <rect x="320" y="150" width="240" height="330" rx="12" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <text x="440" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Active Record</text>
    <text x="440" y="215" text-anchor="middle" font-size="11" fill="#334155">objeto espelha a tabela</text>
    <text x="440" y="232" text-anchor="middle" font-size="11" fill="#334155">e sabe se persistir</text>
    <text x="440" y="249" text-anchor="middle" font-size="11" fill="#334155">(load/save de si mesmo)</text>
    <line x1="350" y1="270" x2="530" y2="270" stroke="#94a3b8" stroke-width="1"/>
    <text x="440" y="295" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Quando usar</text>
    <text x="440" y="315" text-anchor="middle" font-size="11" fill="#334155">CRUD com pouca regra,</text>
    <text x="440" y="332" text-anchor="middle" font-size="11" fill="#334155">validação simples de campo</text>
    <text x="440" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#1e293b">Exemplo</text>
    <text x="440" y="380" text-anchor="middle" font-size="11" fill="#334155">catálogo de produto</text>
  </g>

  <g>
    <rect x="580" y="150" width="240" height="330" rx="12" fill="#c7d2fe" stroke="#818cf8" stroke-width="2"/>
    <text x="700" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#312e81">Domain Model</text>
    <text x="700" y="215" text-anchor="middle" font-size="11" fill="#3730a3">Entidade, Value Object</text>
    <text x="700" y="232" text-anchor="middle" font-size="11" fill="#3730a3">e Aggregate encapsulam</text>
    <text x="700" y="249" text-anchor="middle" font-size="11" fill="#3730a3">comportamento + invariante</text>
    <line x1="610" y1="270" x2="790" y2="270" stroke="#818cf8" stroke-width="1"/>
    <text x="700" y="295" text-anchor="middle" font-size="11" font-weight="600" fill="#312e81">Quando usar</text>
    <text x="700" y="315" text-anchor="middle" font-size="11" fill="#3730a3">muitas regras entrelaçadas,</text>
    <text x="700" y="332" text-anchor="middle" font-size="11" fill="#3730a3">estado com invariante real</text>
    <text x="700" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#312e81">Exemplo</text>
    <text x="700" y="380" text-anchor="middle" font-size="11" fill="#3730a3">motor de precificação</text>
  </g>

  <g>
    <rect x="840" y="150" width="260" height="330" rx="12" fill="#4f46e5" stroke="#4338ca" stroke-width="2"/>
    <text x="970" y="185" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Event-Sourced Domain Model</text>
    <text x="970" y="215" text-anchor="middle" font-size="11" fill="#e0e7ff">estado = replay da</text>
    <text x="970" y="232" text-anchor="middle" font-size="11" fill="#e0e7ff">sequência de eventos,</text>
    <text x="970" y="249" text-anchor="middle" font-size="11" fill="#e0e7ff">não snapshot atual</text>
    <line x1="870" y1="270" x2="1080" y2="270" stroke="#818cf8" stroke-width="1"/>
    <text x="970" y="295" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Quando usar</text>
    <text x="970" y="315" text-anchor="middle" font-size="11" fill="#e0e7ff">auditoria/histórico é regra</text>
    <text x="970" y="332" text-anchor="middle" font-size="11" fill="#e0e7ff">de negócio, não só log técnico</text>
    <text x="970" y="360" text-anchor="middle" font-size="11" font-weight="600" fill="#ffffff">Exemplo</text>
    <text x="970" y="380" text-anchor="middle" font-size="11" fill="#e0e7ff">detecção de fraude</text>
  </g>

  <!-- connecting ticks to spectrum -->
  <line x1="180" y1="115" x2="180" y2="150" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="440" y1="115" x2="440" y2="150" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="700" y1="115" x2="700" y2="150" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="970" y1="115" x2="970" y2="150" stroke="#94a3b8" stroke-width="1.5"/>

  <text x="600" y="525" text-anchor="middle" font-size="12" fill="#64748b">os quatro padrões podem coexistir no mesmo sistema — cada bounded context escolhe o seu, de forma independente</text>
</svg>
