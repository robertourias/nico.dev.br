<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 390" font-family="'Inter', 'Segoe UI', sans-serif">
  <defs>
    <marker id="k8s-arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888898"/>
    </marker>
    <marker id="k8s-arr-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8c547"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="390" fill="#0a0a0f"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#f0efe8">Arquitetura de um cluster Kubernetes</text>

  <rect x="150" y="60" width="400" height="80" rx="12" fill="#111118" stroke="#e8c547" stroke-width="1.5"/>
  <text x="350" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#e8c547">Control plane</text>
  <text x="350" y="108" text-anchor="middle" font-size="11" fill="#888898">agenda os Pods nos nodes, mantém o estado</text>
  <text x="350" y="123" text-anchor="middle" font-size="11" fill="#888898">desejado, escala e coordena atualizações</text>

  <rect x="610" y="70" width="190" height="60" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="705" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#f0efe8">kubectl apply</text>
  <text x="705" y="114" text-anchor="middle" font-size="11" fill="#888898">YAML com o estado desejado</text>
  <line x1="608" y1="100" x2="552" y2="100" stroke="#888898" stroke-width="1.5" marker-end="url(#k8s-arr-g)"/>

  <line x1="242" y1="142" x2="242" y2="178" stroke="#e8c547" stroke-width="1.5" marker-end="url(#k8s-arr-y)"/>
  <line x1="457" y1="142" x2="457" y2="178" stroke="#e8c547" stroke-width="1.5" marker-end="url(#k8s-arr-y)"/>
  <text x="250" y="165" font-size="10" fill="#888898" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">API</text>

  <rect x="150" y="180" width="185" height="120" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="242" y="203" text-anchor="middle" font-size="12" font-weight="700" fill="#f0efe8">Node 1</text>
  <text x="242" y="221" text-anchor="middle" font-size="11" fill="#888898">kubelet + runtime</text>
  <rect x="163" y="240" width="75" height="40" rx="8" fill="#0a0a0f" stroke="#7b61ff" stroke-width="1.5"/>
  <text x="200" y="265" text-anchor="middle" font-size="11" fill="#a78bfa">Pod</text>
  <rect x="247" y="240" width="75" height="40" rx="8" fill="#0a0a0f" stroke="#7b61ff" stroke-width="1.5"/>
  <text x="284" y="265" text-anchor="middle" font-size="11" fill="#a78bfa">Pod</text>

  <rect x="365" y="180" width="185" height="120" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="457" y="203" text-anchor="middle" font-size="12" font-weight="700" fill="#f0efe8">Node 2</text>
  <text x="457" y="221" text-anchor="middle" font-size="11" fill="#888898">kubelet + runtime</text>
  <rect x="378" y="240" width="75" height="40" rx="8" fill="#0a0a0f" stroke="#7b61ff" stroke-width="1.5"/>
  <text x="415" y="265" text-anchor="middle" font-size="11" fill="#a78bfa">Pod</text>
  <rect x="462" y="240" width="75" height="40" rx="8" fill="#0a0a0f" stroke="#7b61ff" stroke-width="1.5"/>
  <text x="499" y="265" text-anchor="middle" font-size="11" fill="#a78bfa">Pod</text>

  <rect x="150" y="325" width="400" height="40" rx="12" fill="#0f766e" fill-opacity="0.18" stroke="#0f766e" stroke-width="1.5"/>
  <text x="350" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#2dd4bf">Service · endereço estável para os Pods</text>
  <line x1="350" y1="323" x2="350" y2="302" stroke="#0f766e" stroke-width="1.5" marker-end="url(#k8s-arr-g)"/>

  <text x="600" y="215" font-size="11" fill="#888898">você declara o estado desejado;</text>
  <text x="600" y="231" font-size="11" fill="#888898">o cluster age até chegar nele</text>
  <text x="600" y="263" font-size="11" fill="#888898">se um Pod morre, outro é criado</text>
  <text x="600" y="279" font-size="11" fill="#888898">em qualquer node com espaço</text>
</svg>
