<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="'Inter', 'Segoe UI', sans-serif">
  <defs>
    <marker id="fw-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888898"/>
    </marker>
  </defs>
  <rect width="900" height="300" fill="#0a0a0f"/>
  <text x="450" y="34" text-anchor="middle" fill="#f0efe8" font-size="20" font-weight="700">O framework de 4 passos para entrevista de system design</text>
  <text x="450" y="54" text-anchor="middle" fill="#888898" font-size="12">o erro mais comum é pular o passo 1 e desenhar direto</text>

  <rect x="30" y="90" width="190" height="150" rx="14" fill="#111118" stroke="#e8c547" stroke-width="1.5"/>
  <text x="125" y="118" text-anchor="middle" fill="#e8c547" font-size="13" font-weight="700">1. Entender e</text>
  <text x="125" y="134" text-anchor="middle" fill="#e8c547" font-size="13" font-weight="700">delimitar</text>
  <text x="125" y="164" text-anchor="middle" fill="#888898" font-size="11">perguntar requisitos,</text>
  <text x="125" y="180" text-anchor="middle" fill="#888898" font-size="11">escala esperada,</text>
  <text x="125" y="196" text-anchor="middle" fill="#888898" font-size="11">restrições — nunca</text>
  <text x="125" y="212" text-anchor="middle" fill="#888898" font-size="11">assumir em silêncio</text>

  <line x1="222" y1="165" x2="248" y2="165" stroke="#888898" stroke-width="1.5" marker-end="url(#fw-arr)"/>

  <rect x="250" y="90" width="190" height="150" rx="14" fill="#111118" stroke="#ffffff14"/>
  <text x="345" y="118" text-anchor="middle" fill="#f0efe8" font-size="13" font-weight="700">2. Design de</text>
  <text x="345" y="134" text-anchor="middle" fill="#f0efe8" font-size="13" font-weight="700">alto nível</text>
  <text x="345" y="164" text-anchor="middle" fill="#888898" font-size="11">caixas e setas —</text>
  <text x="345" y="180" text-anchor="middle" fill="#888898" font-size="11">componentes principais</text>
  <text x="345" y="196" text-anchor="middle" fill="#888898" font-size="11">e como conversam,</text>
  <text x="345" y="212" text-anchor="middle" fill="#888898" font-size="11">valida com o entrevistador</text>

  <line x1="442" y1="165" x2="468" y2="165" stroke="#888898" stroke-width="1.5" marker-end="url(#fw-arr)"/>

  <rect x="470" y="90" width="190" height="150" rx="14" fill="#111118" stroke="#7b61ff" stroke-width="1.5"/>
  <text x="565" y="118" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="700">3. Aprofundar</text>
  <text x="565" y="134" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="700">(deep dive)</text>
  <text x="565" y="164" text-anchor="middle" fill="#888898" font-size="11">gargalo real do</text>
  <text x="565" y="180" text-anchor="middle" fill="#888898" font-size="11">sistema: escala de</text>
  <text x="565" y="196" text-anchor="middle" fill="#888898" font-size="11">escrita, latência,</text>
  <text x="565" y="212" text-anchor="middle" fill="#888898" font-size="11">ponto único de falha</text>

  <line x1="662" y1="165" x2="688" y2="165" stroke="#888898" stroke-width="1.5" marker-end="url(#fw-arr)"/>

  <rect x="690" y="90" width="190" height="150" rx="14" fill="#111118" stroke="#0f766e" stroke-width="1.5"/>
  <text x="785" y="118" text-anchor="middle" fill="#2dd4bf" font-size="13" font-weight="700">4. Wrap-up</text>
  <text x="785" y="164" text-anchor="middle" fill="#888898" font-size="11">trade-offs assumidos,</text>
  <text x="785" y="180" text-anchor="middle" fill="#888898" font-size="11">gargalo que sobrou,</text>
  <text x="785" y="196" text-anchor="middle" fill="#888898" font-size="11">como evoluiria com</text>
  <text x="785" y="212" text-anchor="middle" fill="#888898" font-size="11">10x mais usuários</text>

  <text x="450" y="272" text-anchor="middle" fill="#888898" font-size="11">tempo sugerido: ~5min · ~10-15min · ~15-20min · ~5min, numa entrevista de 45min</text>
</svg>
