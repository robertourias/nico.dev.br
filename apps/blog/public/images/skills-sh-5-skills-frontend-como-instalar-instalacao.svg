<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" font-family="'Inter', 'Segoe UI', sans-serif">
  <defs>
    <marker id="in-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888898"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="320" fill="#0a0a0f"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#f0efe8">Do skills.sh até a sessão do agente</text>
  <text x="470" y="52" text-anchor="middle" font-size="12" fill="#888898">o caminho de uma skill instalada por projeto</text>

  <rect x="20" y="90" width="160" height="96" rx="12" fill="#111118" stroke="#e8c547" stroke-width="1.5"/>
  <text x="100" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#e8c547">skills.sh</text>
  <text x="100" y="142" text-anchor="middle" font-size="11" fill="#888898">diretório e ranking</text>
  <text x="100" y="160" text-anchor="middle" font-size="11" fill="#888898">owner/repo/skill</text>
  <line x1="182" y1="138" x2="203" y2="138" stroke="#888898" stroke-width="1.5" marker-end="url(#in-arr)"/>

  <rect x="205" y="90" width="160" height="96" rx="12" fill="#111118" stroke="#7b61ff" stroke-width="1.5"/>
  <text x="285" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#a78bfa">npx skills add</text>
  <text x="285" y="142" text-anchor="middle" font-size="11" fill="#888898">escolhe agente,</text>
  <text x="285" y="160" text-anchor="middle" font-size="11" fill="#888898">escopo e método</text>
  <line x1="367" y1="138" x2="388" y2="138" stroke="#888898" stroke-width="1.5" marker-end="url(#in-arr)"/>

  <rect x="390" y="90" width="160" height="96" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="470" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#f0efe8">.agents/skills/</text>
  <text x="470" y="142" text-anchor="middle" font-size="11" fill="#888898">cópia canônica</text>
  <text x="470" y="160" text-anchor="middle" font-size="11" fill="#888898">de cada skill</text>
  <line x1="552" y1="138" x2="573" y2="138" stroke="#888898" stroke-width="1.5" marker-end="url(#in-arr)"/>

  <rect x="575" y="90" width="160" height="96" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="655" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#f0efe8">.claude/skills/</text>
  <text x="655" y="142" text-anchor="middle" font-size="11" fill="#888898">symlink para o</text>
  <text x="655" y="160" text-anchor="middle" font-size="11" fill="#888898">Claude Code</text>
  <line x1="737" y1="138" x2="758" y2="138" stroke="#888898" stroke-width="1.5" marker-end="url(#in-arr)"/>

  <rect x="760" y="90" width="160" height="96" rx="12" fill="#0f766e" fill-opacity="0.18" stroke="#0f766e" stroke-width="1.5"/>
  <text x="840" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#2dd4bf">Sessão do agente</text>
  <text x="840" y="142" text-anchor="middle" font-size="11" fill="#888898">description sempre;</text>
  <text x="840" y="160" text-anchor="middle" font-size="11" fill="#888898">corpo ao bater</text>

  <line x1="285" y1="188" x2="285" y2="222" stroke="#888898" stroke-width="1.5" marker-end="url(#in-arr)"/>
  <rect x="185" y="224" width="200" height="44" rx="10" fill="#111118" stroke="#ffffff14"/>
  <text x="285" y="243" text-anchor="middle" font-size="12" font-weight="700" fill="#f0efe8">skills-lock.json</text>
  <text x="285" y="259" text-anchor="middle" font-size="10" fill="#888898">fonte e hash por skill</text>

  <text x="640" y="246" text-anchor="middle" font-size="11" fill="#888898">commit dessas pastas no repositório:</text>
  <text x="640" y="262" text-anchor="middle" font-size="11" fill="#888898">o time inteiro herda as mesmas skills</text>
  <text x="470" y="304" text-anchor="middle" font-size="11" fill="#888898">com o método "copy", cada agente recebe uma cópia independente em vez de symlink</text>
</svg>
