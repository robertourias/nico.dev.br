<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 360" font-family="'Inter', 'Segoe UI', sans-serif">
  <defs>
    <marker id="rk-arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888898"/>
    </marker>
    <marker id="rk-arr-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8c547"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="360" fill="#0a0a0f"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#f0efe8">Dois modelos para mover mensagens</text>
  <line x1="470" y1="60" x2="470" y2="300" stroke="#ffffff14"/>

  <text x="20" y="75" font-size="13" font-weight="700" fill="#e8c547">RabbitMQ · broker com filas</text>

  <rect x="20" y="135" width="80" height="50" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="60" y="165" text-anchor="middle" font-size="11" fill="#f0efe8">Produtor</text>
  <line x1="102" y1="160" x2="123" y2="160" stroke="#888898" stroke-width="1.5" marker-end="url(#rk-arr-g)"/>

  <rect x="125" y="135" width="90" height="50" rx="12" fill="#111118" stroke="#e8c547" stroke-width="1.5"/>
  <text x="170" y="165" text-anchor="middle" font-size="11" font-weight="700" fill="#e8c547">Exchange</text>
  <line x1="217" y1="150" x2="243" y2="128" stroke="#e8c547" stroke-width="1.5" marker-end="url(#rk-arr-y)"/>
  <line x1="217" y1="172" x2="243" y2="194" stroke="#e8c547" stroke-width="1.5" marker-end="url(#rk-arr-y)"/>

  <rect x="245" y="105" width="90" height="40" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="290" y="130" text-anchor="middle" font-size="11" fill="#f0efe8">Fila A</text>
  <rect x="245" y="175" width="90" height="40" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="290" y="200" text-anchor="middle" font-size="11" fill="#f0efe8">Fila B</text>
  <line x1="337" y1="125" x2="363" y2="125" stroke="#888898" stroke-width="1.5" marker-end="url(#rk-arr-g)"/>
  <line x1="337" y1="195" x2="363" y2="195" stroke="#888898" stroke-width="1.5" marker-end="url(#rk-arr-g)"/>

  <rect x="365" y="105" width="85" height="40" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="407" y="130" text-anchor="middle" font-size="11" fill="#f0efe8">Consumidor A</text>
  <rect x="365" y="175" width="85" height="40" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="407" y="200" text-anchor="middle" font-size="11" fill="#f0efe8">Consumidor B</text>

  <text x="20" y="255" font-size="11" fill="#888898">a exchange roteia por bindings para as filas</text>
  <text x="20" y="272" font-size="11" fill="#888898">a mensagem lida e confirmada sai da fila</text>

  <text x="490" y="75" font-size="13" font-weight="700" fill="#a78bfa">Kafka · log distribuído</text>

  <rect x="490" y="135" width="80" height="50" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="530" y="165" text-anchor="middle" font-size="11" fill="#f0efe8">Produtor</text>
  <line x1="572" y1="160" x2="593" y2="160" stroke="#888898" stroke-width="1.5" marker-end="url(#rk-arr-g)"/>

  <rect x="595" y="95" width="150" height="130" rx="12" fill="#111118" stroke="#7b61ff" stroke-width="1.5"/>
  <text x="670" y="117" text-anchor="middle" font-size="11" font-weight="700" fill="#a78bfa">Tópico pedidos</text>
  <rect x="607" y="127" width="126" height="24" rx="6" fill="#0a0a0f" stroke="#ffffff14"/>
  <text x="670" y="143" text-anchor="middle" font-size="11" fill="#888898">P0 · 0 1 2 3 4</text>
  <rect x="607" y="157" width="126" height="24" rx="6" fill="#0a0a0f" stroke="#ffffff14"/>
  <text x="670" y="173" text-anchor="middle" font-size="11" fill="#888898">P1 · 0 1 2 3</text>
  <rect x="607" y="187" width="126" height="24" rx="6" fill="#0a0a0f" stroke="#ffffff14"/>
  <text x="670" y="203" text-anchor="middle" font-size="11" fill="#888898">P2 · 0 1 2 3 4 5</text>

  <line x1="747" y1="125" x2="773" y2="122" stroke="#888898" stroke-width="1.5" marker-end="url(#rk-arr-g)"/>
  <line x1="747" y1="195" x2="773" y2="192" stroke="#888898" stroke-width="1.5" marker-end="url(#rk-arr-g)"/>

  <rect x="775" y="100" width="145" height="40" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="847" y="125" text-anchor="middle" font-size="11" fill="#f0efe8">Grupo A · offset</text>
  <rect x="775" y="172" width="145" height="40" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="847" y="197" text-anchor="middle" font-size="11" fill="#f0efe8">Grupo B · offset</text>

  <text x="490" y="255" font-size="11" fill="#888898">o evento fica pelo tempo de retenção</text>
  <text x="490" y="272" font-size="11" fill="#888898">cada grupo lê no seu ritmo e pode reler</text>

  <text x="470" y="335" text-anchor="middle" font-size="11" fill="#888898">RabbitMQ entrega tarefas a quem vai processá-las; Kafka guarda um histórico que vários leitores consultam</text>
</svg>
