<svg viewBox="0 0 1340 1060" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1340" height="1060" fill="#ffffff"/>
  <rect x="10" y="10" width="1320" height="1040" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text x="660" y="45" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">SaaS com Next.js + NestJS — arquitetura de produção</text>
  <text x="660" y="68" text-anchor="middle" font-size="13" fill="#64748b">Cloudflare · Traefik · containers replicados · Postgres · Redis · storage S3-compatible</text>

  <!-- Row A: Navegador -->
  <rect x="480" y="95" width="320" height="60" rx="10" fill="#334155"/>
  <text x="640" y="120" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Navegador</text>
  <text x="640" y="140" text-anchor="middle" font-size="12" fill="#cbd5e1">usuário do SaaS</text>

  <!-- Row B: Cloudflare -->
  <rect x="480" y="195" width="320" height="60" rx="10" fill="#ea580c"/>
  <text x="640" y="220" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Cloudflare</text>
  <text x="640" y="240" text-anchor="middle" font-size="12" fill="#ffedd5">DDoS, cache de estático, DNS</text>

  <!-- Row C: Traefik -->
  <rect x="480" y="295" width="320" height="60" rx="10" fill="#7c3aed"/>
  <text x="640" y="320" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Traefik</text>
  <text x="640" y="340" text-anchor="middle" font-size="12" fill="#ede9fe">reverse proxy, TLS, roteamento por domínio</text>

  <!-- Row D: Next.js replicas -->
  <rect x="120" y="435" width="180" height="60" rx="10" fill="#0f172a"/>
  <text x="210" y="460" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Next.js #1</text>
  <text x="210" y="478" text-anchor="middle" font-size="11" fill="#cbd5e1">SSR / CSR</text>

  <rect x="330" y="435" width="180" height="60" rx="10" fill="#0f172a"/>
  <text x="420" y="460" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Next.js #2</text>
  <text x="420" y="478" text-anchor="middle" font-size="11" fill="#cbd5e1">SSR / CSR</text>

  <!-- Row D: NestJS BFF replicas -->
  <rect x="770" y="435" width="180" height="60" rx="10" fill="#e11d48"/>
  <text x="860" y="460" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">NestJS BFF #1</text>
  <text x="860" y="478" text-anchor="middle" font-size="11" fill="#fecdd3">stateless</text>

  <rect x="980" y="435" width="180" height="60" rx="10" fill="#e11d48"/>
  <text x="1070" y="460" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">NestJS BFF #2</text>
  <text x="1070" y="478" text-anchor="middle" font-size="11" fill="#fecdd3">stateless</text>

  <!-- Row E: Worker -->
  <rect x="770" y="565" width="390" height="60" rx="10" fill="#6d28d9"/>
  <text x="965" y="590" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">Worker (BullMQ)</text>
  <text x="965" y="608" text-anchor="middle" font-size="11" fill="#ede9fe">e-mail, relatório, processamento de imagem</text>

  <!-- Row F: Postgres, Redis, Storage -->
  <rect x="70" y="705" width="280" height="65" rx="10" fill="#2563eb"/>
  <text x="210" y="732" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Postgres</text>
  <text x="210" y="752" text-anchor="middle" font-size="12" fill="#dbeafe">primário + réplica de leitura</text>

  <rect x="480" y="705" width="280" height="65" rx="10" fill="#dc2626"/>
  <text x="620" y="732" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Redis</text>
  <text x="620" y="752" text-anchor="middle" font-size="12" fill="#fee2e2">cache, sessão/denylist, fila (BullMQ)</text>

  <rect x="890" y="705" width="280" height="65" rx="10" fill="#f59e0b"/>
  <text x="1030" y="732" text-anchor="middle" font-size="15" font-weight="600" fill="#ffffff">Storage S3-compatible</text>
  <text x="1030" y="752" text-anchor="middle" font-size="12" fill="#fffbeb">uploads via presigned URL</text>

  <!-- Row G: PgBouncer note -->
  <rect x="70" y="850" width="280" height="55" rx="10" fill="#1e40af" opacity="0.85"/>
  <text x="210" y="874" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">PgBouncer</text>
  <text x="210" y="892" text-anchor="middle" font-size="11" fill="#dbeafe">pooling de conexão</text>

  <!-- Arrows: main synchronous flow -->
  <line x1="640" y1="155" x2="640" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="255" x2="640" y2="295" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="580" y1="355" x2="280" y2="435" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="355" x2="450" y2="435" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="420" y="405" font-size="11" fill="#475569">round-robin</text>

  <line x1="510" y1="465" x2="770" y2="465" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="450" text-anchor="middle" font-size="11" fill="#475569">fetch do BFF</text>

  <line x1="210" y1="495" x2="210" y2="705" stroke="#475569" stroke-width="2" stroke-dasharray="3,3"/>

  <path d="M 850 495 L 210 705" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" fill="none"/>
  <path d="M 900 495 L 610 705" stroke="#475569" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)" fill="none"/>
  <text x="760" y="600" font-size="11" fill="#475569">consulta cache / query</text>

  <line x1="210" y1="770" x2="210" y2="850" stroke="#1e40af" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- Queue flow (purple) -->
  <path d="M 1000 495 L 970 565" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowPurple)"/>
  <text x="1035" y="535" font-size="11" fill="#7c3aed">publica job</text>

  <path d="M 850 595 L 620 705" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowPurple)" fill="none"/>
  <text x="770" y="665" font-size="11" fill="#7c3aed">consome fila</text>

  <!-- Upload flow (orange) -->
  <path d="M 1180 465 L 1270 465 L 1270 737 L 1170 737" stroke="#c2410c" stroke-width="2" stroke-dasharray="6,4" fill="none" marker-end="url(#arrowOrange)"/>
  <text x="1290" y="601" font-size="11" fill="#c2410c" transform="rotate(-90 1290,601)" text-anchor="middle">upload direto — presigned URL</text>

  <line x1="800" y1="225" x2="1030" y2="225" stroke="#c2410c" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="920" y="215" text-anchor="middle" font-size="10" fill="#c2410c">solicita URL de upload</text>
  <path d="M 1030 255 L 1030 705" stroke="#c2410c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowOrange)"/>

  <!-- Legend -->
  <g transform="translate(60,970)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#475569"/>
    <text x="22" y="13" font-size="12" fill="#334155">fluxo síncrono (leitura/escrita)</text>
  </g>
  <g transform="translate(340,970)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#c2410c"/>
    <text x="22" y="13" font-size="12" fill="#334155">upload direto pro storage</text>
  </g>
  <g transform="translate(600,970)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#7c3aed"/>
    <text x="22" y="13" font-size="12" fill="#334155">fila assíncrona (BullMQ)</text>
  </g>
  <g transform="translate(840,970)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#dc2626"/>
    <text x="22" y="13" font-size="12" fill="#334155">Redis</text>
  </g>
  <g transform="translate(940,970)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#2563eb"/>
    <text x="22" y="13" font-size="12" fill="#334155">Postgres</text>
  </g>
  <g transform="translate(1060,970)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#f59e0b"/>
    <text x="22" y="13" font-size="12" fill="#334155">storage S3-compatible</text>
  </g>
</svg>
