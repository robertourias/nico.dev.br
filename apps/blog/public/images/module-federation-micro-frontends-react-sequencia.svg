<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#888898"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7b61ff"/>
    </marker>
    <marker id="arrYellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8c547"/>
    </marker>
  </defs>

  <rect width="800" height="560" fill="#0a0a0f"/>

  <text x="400" y="36" text-anchor="middle" fill="#f0efe8" font-size="20" font-weight="700">Como o host carrega os remotes em runtime</text>

  <!-- Actors -->
  <rect x="40" y="56" width="120" height="40" rx="10" fill="#111118" stroke="#ffffff14"/>
  <text x="100" y="81" text-anchor="middle" fill="#f0efe8" font-size="13" font-weight="600">Usuário</text>

  <rect x="210" y="56" width="140" height="40" rx="10" fill="#111118" stroke="#e8c547" stroke-width="1.5"/>
  <text x="280" y="81" text-anchor="middle" fill="#e8c547" font-size="13" font-weight="700">Host (shell)</text>

  <rect x="410" y="56" width="140" height="40" rx="10" fill="#111118" stroke="#7b61ff" stroke-width="1.5"/>
  <text x="480" y="81" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="700">Remote catalog</text>

  <rect x="610" y="56" width="140" height="40" rx="10" fill="#111118" stroke="#7b61ff" stroke-width="1.5"/>
  <text x="680" y="81" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="700">Remote cart</text>

  <!-- Lifelines -->
  <g stroke="#ffffff14" stroke-width="1.5" stroke-dasharray="4 5">
    <line x1="100" y1="96" x2="100" y2="530"/>
    <line x1="280" y1="96" x2="280" y2="530"/>
    <line x1="480" y1="96" x2="480" y2="530"/>
    <line x1="680" y1="96" x2="680" y2="530"/>
  </g>

  <!-- 1 -->
  <line x1="100" y1="130" x2="276" y2="130" stroke="#888898" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="188" y="122" text-anchor="middle" fill="#888898" font-size="11" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">abre a página</text>

  <!-- 2: share scope -->
  <rect x="200" y="150" width="290" height="40" rx="8" fill="#e8c547" fill-opacity="0.1" stroke="#e8c547" stroke-opacity="0.6"/>
  <text x="345" y="167" text-anchor="middle" fill="#e8c547" font-size="11" font-weight="600">inicializa o share scope</text>
  <text x="345" y="182" text-anchor="middle" fill="#e8c547" font-size="10">react e react-dom registrados uma vez</text>

  <!-- 3 -->
  <line x1="280" y1="222" x2="476" y2="222" stroke="#888898" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="380" y="214" text-anchor="middle" fill="#888898" font-size="11" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">GET remoteEntry.js</text>

  <!-- 4 -->
  <line x1="480" y1="250" x2="284" y2="250" stroke="#888898" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="380" y="242" text-anchor="middle" fill="#888898" font-size="11" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">catálogo de módulos</text>

  <!-- 5 -->
  <line x1="280" y1="280" x2="476" y2="280" stroke="#7b61ff" stroke-width="1.5" marker-end="url(#arrPurple)"/>
  <text x="380" y="272" text-anchor="middle" fill="#a78bfa" font-size="11" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">pede ./ProductList</text>

  <!-- 6 -->
  <line x1="480" y1="310" x2="284" y2="310" stroke="#7b61ff" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrPurple)"/>
  <text x="380" y="302" text-anchor="middle" fill="#a78bfa" font-size="11" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">chunk (reusa o React do host)</text>

  <!-- 7 -->
  <line x1="280" y1="352" x2="676" y2="352" stroke="#888898" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="580" y="344" text-anchor="middle" fill="#888898" font-size="11" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">GET remoteEntry.js</text>

  <!-- 8 -->
  <line x1="680" y1="380" x2="284" y2="380" stroke="#888898" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="580" y="372" text-anchor="middle" fill="#888898" font-size="11" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">catálogo de módulos</text>

  <!-- 9 -->
  <line x1="280" y1="410" x2="676" y2="410" stroke="#7b61ff" stroke-width="1.5" marker-end="url(#arrPurple)"/>
  <text x="580" y="402" text-anchor="middle" fill="#a78bfa" font-size="11" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">pede ./CartWidget</text>

  <!-- 10 -->
  <line x1="680" y1="440" x2="284" y2="440" stroke="#7b61ff" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrPurple)"/>
  <text x="580" y="432" text-anchor="middle" fill="#a78bfa" font-size="11" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">chunk do componente</text>

  <!-- 11 -->
  <line x1="280" y1="482" x2="104" y2="482" stroke="#e8c547" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrYellow)"/>
  <text x="192" y="474" text-anchor="middle" fill="#e8c547" font-size="11" font-weight="600" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">página composta</text>
</svg>
