<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#888898"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7b61ff"/>
    </marker>
    <marker id="arrYellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8c547"/>
    </marker>
  </defs>

  <rect width="800" height="420" fill="#0a0a0f"/>

  <text x="400" y="32" text-anchor="middle" fill="#f0efe8" font-size="20" font-weight="700">Sequência: fluxo de login</text>

  <!-- Actors -->
  <rect x="50" y="52" width="120" height="40" rx="10" fill="#111118" stroke="#ffffff14"/>
  <text x="110" y="77" text-anchor="middle" fill="#f0efe8" font-size="13" font-weight="600">Usuário</text>
  <rect x="230" y="52" width="120" height="40" rx="10" fill="#111118" stroke="#e8c547" stroke-width="1.5"/>
  <text x="290" y="77" text-anchor="middle" fill="#e8c547" font-size="13" font-weight="700">Web App</text>
  <rect x="430" y="52" width="120" height="40" rx="10" fill="#111118" stroke="#7b61ff" stroke-width="1.5"/>
  <text x="490" y="77" text-anchor="middle" fill="#a78bfa" font-size="13" font-weight="700">API</text>
  <rect x="630" y="52" width="120" height="40" rx="10" fill="#111118" stroke="#0f766e" stroke-width="1.5"/>
  <text x="690" y="77" text-anchor="middle" fill="#2dd4bf" font-size="13" font-weight="700">DB</text>

  <!-- Lifelines -->
  <g stroke="#ffffff14" stroke-width="1.5" stroke-dasharray="4 5">
    <line x1="110" y1="92" x2="110" y2="395"/>
    <line x1="290" y1="92" x2="290" y2="395"/>
    <line x1="490" y1="92" x2="490" y2="395"/>
    <line x1="690" y1="92" x2="690" y2="395"/>
  </g>

  <!-- 1 -->
  <line x1="110" y1="142" x2="286" y2="142" stroke="#888898" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="198" y="134" text-anchor="middle" fill="#888898" font-size="11" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">Preenche login</text>

  <!-- 2 -->
  <line x1="290" y1="194" x2="486" y2="194" stroke="#888898" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="390" y="186" text-anchor="middle" fill="#888898" font-size="11" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">POST /auth/login</text>

  <!-- 3 -->
  <line x1="490" y1="246" x2="686" y2="246" stroke="#7b61ff" stroke-width="1.5" marker-end="url(#arrPurple)"/>
  <text x="590" y="238" text-anchor="middle" fill="#a78bfa" font-size="11" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">Busca usuário</text>

  <!-- 4 -->
  <line x1="690" y1="296" x2="494" y2="296" stroke="#7b61ff" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrPurple)"/>
  <text x="590" y="288" text-anchor="middle" fill="#a78bfa" font-size="11" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">Retorna dados</text>

  <!-- 5 -->
  <line x1="490" y1="348" x2="294" y2="348" stroke="#e8c547" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrYellow)"/>
  <text x="390" y="340" text-anchor="middle" fill="#e8c547" font-size="11" font-weight="600" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">200 { token }</text>
</svg>
