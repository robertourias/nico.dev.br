<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 580" role="img" aria-labelledby="t d" font-family="'Inter', 'Segoe UI', sans-serif">
  <title id="t">Fluxo Authorization Code com PKCE</title>
  <desc id="d">Sequência entre navegador do usuário, aplicação cliente, servidor de autorização e API. O cliente gera um code_challenge e redireciona o navegador ao servidor de autorização, onde o usuário faz login e consente. O servidor devolve um code pelo navegador. O cliente troca o code mais o code_verifier por um access_token e usa esse token como Bearer na chamada à API.</desc>
  <defs>
    <marker id="oa-m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#f0efe8"/>
    </marker>
    <marker id="oa-m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#888898"/>
    </marker>
    <marker id="oa-m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e8c547"/>
    </marker>
  </defs>
  <rect width="800" height="580" fill="#0a0a0f"/>

  <!-- atores -->
  <rect x="30" y="20" width="140" height="40" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="100" y="45" font-size="13" font-weight="700" text-anchor="middle" fill="#f0efe8">Navegador</text>
  <rect x="230" y="20" width="140" height="40" rx="12" fill="#111118" stroke="#7b61ff"/>
  <text x="300" y="45" font-size="13" font-weight="700" text-anchor="middle" fill="#a78bfa">Client (app)</text>
  <rect x="430" y="20" width="140" height="40" rx="12" fill="#111118" stroke="#e8c547"/>
  <text x="500" y="45" font-size="13" font-weight="700" text-anchor="middle" fill="#e8c547">Auth Server</text>
  <rect x="630" y="20" width="140" height="40" rx="12" fill="#111118" stroke="#0f766e"/>
  <text x="700" y="45" font-size="13" font-weight="700" text-anchor="middle" fill="#2dd4bf">API (recurso)</text>

  <g stroke="#888898" stroke-width="1" stroke-dasharray="4 4">
    <line x1="100" y1="60" x2="100" y2="565"/>
    <line x1="300" y1="60" x2="300" y2="565"/>
    <line x1="500" y1="60" x2="500" y2="565"/>
    <line x1="700" y1="60" x2="700" y2="565"/>
  </g>

  <!-- 1 -->
  <line x1="102" y1="105" x2="298" y2="105" stroke="#f0efe8" stroke-width="1.8" marker-end="url(#oa-m1)"/>
  <text x="200" y="97" font-size="12" text-anchor="middle" fill="#f0efe8">1. clica em Entrar</text>
  <!-- 2 -->
  <line x1="298" y1="155" x2="102" y2="155" stroke="#888898" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#oa-m2)"/>
  <text x="200" y="145" font-size="12" text-anchor="middle" fill="#f0efe8">2. redireciona ao /authorize</text>
  <text x="200" y="171" font-size="11" text-anchor="middle" fill="#e8c547">+ code_challenge</text>
  <!-- 3 -->
  <line x1="102" y1="205" x2="498" y2="205" stroke="#f0efe8" stroke-width="1.8" marker-end="url(#oa-m1)"/>
  <text x="300" y="197" font-size="12" text-anchor="middle" fill="#f0efe8" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">3. GET /authorize (scope, state)</text>
  <!-- 4 -->
  <rect x="400" y="228" width="200" height="40" rx="12" fill="#111118" stroke="#e8c547"/>
  <text x="500" y="253" font-size="12" text-anchor="middle" fill="#e8c547">4. login + consentimento</text>
  <!-- 5 -->
  <line x1="498" y1="305" x2="102" y2="305" stroke="#888898" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#oa-m2)"/>
  <text x="300" y="297" font-size="12" text-anchor="middle" fill="#f0efe8" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">5. redirect com code + state</text>
  <!-- 6 -->
  <line x1="102" y1="350" x2="298" y2="350" stroke="#f0efe8" stroke-width="1.8" marker-end="url(#oa-m1)"/>
  <text x="200" y="342" font-size="12" text-anchor="middle" fill="#f0efe8">6. callback ?code&amp;state</text>
  <!-- 7 -->
  <line x1="302" y1="400" x2="498" y2="400" stroke="#e8c547" stroke-width="1.8" marker-end="url(#oa-m3)"/>
  <text x="400" y="390" font-size="12" text-anchor="middle" fill="#f0efe8">7. POST /token</text>
  <text x="400" y="416" font-size="11" text-anchor="middle" fill="#e8c547">code + code_verifier</text>
  <!-- 8 -->
  <line x1="498" y1="455" x2="302" y2="455" stroke="#888898" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#oa-m2)"/>
  <text x="400" y="445" font-size="12" text-anchor="middle" fill="#f0efe8">8. access_token</text>
  <text x="400" y="471" font-size="11" text-anchor="middle" fill="#888898">(+ refresh_token)</text>
  <!-- 9 -->
  <line x1="302" y1="505" x2="698" y2="505" stroke="#f0efe8" stroke-width="1.8" marker-end="url(#oa-m1)"/>
  <text x="500" y="497" font-size="12" text-anchor="middle" fill="#f0efe8" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">9. Authorization: Bearer access_token</text>
  <!-- 10 -->
  <line x1="698" y1="545" x2="302" y2="545" stroke="#888898" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#oa-m2)"/>
  <text x="500" y="537" font-size="12" text-anchor="middle" fill="#f0efe8" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">10. dados do recurso</text>
</svg>
