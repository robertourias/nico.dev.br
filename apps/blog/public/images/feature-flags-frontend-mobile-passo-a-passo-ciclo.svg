<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" font-family="'Inter', 'Segoe UI', sans-serif">
  <defs>
    <marker id="ff-arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888898"/>
    </marker>
    <marker id="ff-arr-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8c547"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="330" fill="#0a0a0f"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#f0efe8">Ciclo de vida de uma feature flag</text>

  <rect x="20" y="75" width="160" height="100" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="100" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#f0efe8">1 · Criar</text>
  <text x="100" y="129" text-anchor="middle" font-size="11" fill="#888898">flag nasce desligada,</text>
  <text x="100" y="145" text-anchor="middle" font-size="11" fill="#888898">com valor padrão seguro</text>
  <line x1="182" y1="125" x2="203" y2="125" stroke="#888898" stroke-width="1.5" marker-end="url(#ff-arr-g)"/>

  <rect x="205" y="75" width="160" height="100" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="285" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#f0efe8">2 · Publicar</text>
  <text x="285" y="129" text-anchor="middle" font-size="11" fill="#888898">código novo vai para</text>
  <text x="285" y="145" text-anchor="middle" font-size="11" fill="#888898">produção atrás da flag</text>
  <line x1="367" y1="125" x2="388" y2="125" stroke="#888898" stroke-width="1.5" marker-end="url(#ff-arr-g)"/>

  <rect x="390" y="75" width="160" height="100" rx="12" fill="#111118" stroke="#e8c547" stroke-width="1.5"/>
  <text x="470" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#e8c547">3 · Liberar</text>
  <text x="470" y="129" text-anchor="middle" font-size="11" fill="#888898">aos poucos, por grupo</text>
  <text x="470" y="145" text-anchor="middle" font-size="11" fill="#888898">ou % de usuários</text>
  <line x1="552" y1="125" x2="573" y2="125" stroke="#888898" stroke-width="1.5" marker-end="url(#ff-arr-g)"/>

  <rect x="575" y="75" width="160" height="100" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="655" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#f0efe8">4 · Consolidar</text>
  <text x="655" y="129" text-anchor="middle" font-size="11" fill="#888898">100% dos usuários,</text>
  <text x="655" y="145" text-anchor="middle" font-size="11" fill="#888898">acompanhando métricas</text>
  <line x1="737" y1="125" x2="758" y2="125" stroke="#888898" stroke-width="1.5" marker-end="url(#ff-arr-g)"/>

  <rect x="760" y="75" width="160" height="100" rx="12" fill="#0f766e" fill-opacity="0.18" stroke="#0f766e" stroke-width="1.5"/>
  <text x="840" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#2dd4bf">5 · Remover</text>
  <text x="840" y="129" text-anchor="middle" font-size="11" fill="#888898">apaga a flag e o</text>
  <text x="840" y="145" text-anchor="middle" font-size="11" fill="#888898">caminho antigo</text>

  <path d="M470,177 L470,235 L100,235 L100,179" fill="none" stroke="#e8c547" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ff-arr-y)"/>
  <text x="285" y="229" text-anchor="middle" font-size="11" fill="#e8c547" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">kill switch: volta a 0% sem novo deploy</text>

  <text x="470" y="296" text-anchor="middle" font-size="11" fill="#888898">a flag existe para ser temporária: sem o passo 5, ela vira dívida técnica</text>
</svg>
