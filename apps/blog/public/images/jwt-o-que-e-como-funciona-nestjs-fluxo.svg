<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="'Inter', 'Segoe UI', sans-serif">
  <defs>
    <marker id="jwtfl-arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888898"/>
    </marker>
    <marker id="jwtfl-arr-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8c547"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="430" fill="#0a0a0f"/>
  <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#f0efe8">Login com access token e refresh token</text>

  <rect x="50" y="50" width="140" height="32" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="120" y="71" text-anchor="middle" font-size="12" font-weight="700" fill="#f0efe8">Cliente</text>
  <rect x="310" y="50" width="140" height="32" rx="12" fill="#0f766e" fill-opacity="0.18" stroke="#0f766e" stroke-width="1.5"/>
  <text x="380" y="71" text-anchor="middle" font-size="12" font-weight="700" fill="#2dd4bf">API NestJS</text>
  <rect x="570" y="50" width="140" height="32" rx="12" fill="#111118" stroke="#e8c547" stroke-width="1.5"/>
  <text x="640" y="71" text-anchor="middle" font-size="12" font-weight="700" fill="#e8c547">Redis</text>

  <line x1="120" y1="82" x2="120" y2="410" stroke="#ffffff14" stroke-width="1.5"/>
  <line x1="380" y1="82" x2="380" y2="410" stroke="#ffffff14" stroke-width="1.5"/>
  <line x1="640" y1="82" x2="640" y2="410" stroke="#ffffff14" stroke-width="1.5"/>

  <line x1="120" y1="120" x2="378" y2="120" stroke="#888898" stroke-width="1.5" marker-end="url(#jwtfl-arr-g)"/>
  <text x="250" y="113" text-anchor="middle" font-size="11" fill="#f0efe8" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">1 · POST /auth/login (e-mail e senha)</text>

  <line x1="380" y1="160" x2="638" y2="160" stroke="#e8c547" stroke-width="1.5" marker-end="url(#jwtfl-arr-y)"/>
  <text x="510" y="153" text-anchor="middle" font-size="11" fill="#f0efe8" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">2 · grava hash do refresh (TTL 7 dias)</text>

  <line x1="380" y1="200" x2="122" y2="200" stroke="#888898" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#jwtfl-arr-g)"/>
  <text x="250" y="193" text-anchor="middle" font-size="11" fill="#f0efe8" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">3 · access token + cookie do refresh</text>

  <line x1="120" y1="245" x2="378" y2="245" stroke="#888898" stroke-width="1.5" marker-end="url(#jwtfl-arr-g)"/>
  <text x="250" y="238" text-anchor="middle" font-size="11" fill="#f0efe8" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">4 · GET /auth/me + Bearer access token</text>
  <text x="510" y="262" text-anchor="middle" font-size="11" fill="#888898">verifica assinatura e exp, sem ir ao Redis</text>

  <line x1="120" y1="300" x2="378" y2="300" stroke="#888898" stroke-width="1.5" marker-end="url(#jwtfl-arr-g)"/>
  <text x="250" y="293" text-anchor="middle" font-size="11" fill="#f0efe8" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">5 · access expirou: POST /auth/refresh</text>

  <line x1="380" y1="340" x2="638" y2="340" stroke="#e8c547" stroke-width="1.5" marker-end="url(#jwtfl-arr-y)"/>
  <text x="510" y="333" text-anchor="middle" font-size="11" fill="#f0efe8" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">6 · GETDEL do refresh antigo</text>

  <line x1="380" y1="385" x2="122" y2="385" stroke="#888898" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#jwtfl-arr-g)"/>
  <text x="250" y="378" text-anchor="middle" font-size="11" fill="#f0efe8" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">7 · novo access e novo refresh</text>
</svg>
