<svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#888898"/>
    </marker>
  </defs>

  <rect width="800" height="450" fill="#0a0a0f"/>

  <text x="400" y="32" text-anchor="middle" fill="#f0efe8" font-size="20" font-weight="700">Arquitetura de infra: FitFlow na VPS</text>

  <!-- Internet -->
  <rect x="300" y="52" width="200" height="44" rx="22" fill="#111118" stroke="#ffffff14"/>
  <text x="400" y="79" text-anchor="middle" fill="#f0efe8" font-size="13" font-weight="600">Internet</text>

  <line x1="400" y1="96" x2="400" y2="164" stroke="#888898" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="414" y="134" fill="#888898" font-size="11">HTTPS :443</text>

  <!-- VPS boundary -->
  <rect x="110" y="126" width="580" height="300" rx="16" fill="none" stroke="#e8c547" stroke-opacity="0.6" stroke-dasharray="6 5"/>
  <text x="128" y="146" fill="#e8c547" font-size="12" font-weight="700">VPS Hostinger</text>

  <!-- Traefik -->
  <rect x="300" y="168" width="200" height="60" rx="14" fill="#111118" stroke="#7b61ff" stroke-width="1.5"/>
  <text x="400" y="194" text-anchor="middle" fill="#f0efe8" font-size="14" font-weight="700">Traefik</text>
  <text x="400" y="212" text-anchor="middle" fill="#a78bfa" font-size="10">reverse proxy + SSL</text>

  <!-- Docker boundary -->
  <rect x="150" y="270" width="500" height="132" rx="14" fill="none" stroke="#888898" stroke-dasharray="4 4"/>
  <text x="168" y="290" fill="#888898" font-size="12" font-weight="700">Docker</text>

  <!-- App -->
  <rect x="190" y="322" width="190" height="60" rx="14" fill="#111118" stroke="#ffffff14"/>
  <text x="285" y="348" text-anchor="middle" fill="#f0efe8" font-size="14" font-weight="700">App</text>
  <text x="285" y="366" text-anchor="middle" fill="#888898" font-size="10">fitflow.nico.dev.br</text>

  <!-- Postgres -->
  <rect x="440" y="322" width="170" height="60" rx="14" fill="#0f766e" fill-opacity="0.15" stroke="#0f766e" stroke-width="1.5"/>
  <text x="525" y="348" text-anchor="middle" fill="#f0efe8" font-size="14" font-weight="700">PostgreSQL</text>
  <text x="525" y="366" text-anchor="middle" fill="#2dd4bf" font-size="10">banco de dados</text>

  <!-- Arrows -->
  <line x1="360" y1="228" x2="290" y2="318" stroke="#888898" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="313" y="252" text-anchor="end" fill="#888898" font-size="11">fitflow.nico.dev.br</text>

  <line x1="380" y1="352" x2="436" y2="352" stroke="#888898" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
