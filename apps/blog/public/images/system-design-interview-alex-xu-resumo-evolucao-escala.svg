<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 320" font-family="'Inter', 'Segoe UI', sans-serif">
  <defs>
    <marker id="ev-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888898"/>
    </marker>
  </defs>
  <rect width="940" height="320" fill="#0a0a0f"/>
  <text x="470" y="32" text-anchor="middle" fill="#f0efe8" font-size="20" font-weight="700">De um servidor a milhões de usuários</text>
  <text x="470" y="52" text-anchor="middle" fill="#888898" font-size="12">cada estágio resolve o gargalo que o anterior deixou</text>

  <!-- stage 1 -->
  <rect x="20" y="90" width="150" height="110" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="95" y="114" text-anchor="middle" fill="#f0efe8" font-size="12" font-weight="700">1 servidor</text>
  <text x="95" y="136" text-anchor="middle" fill="#888898" font-size="10">web + app + banco</text>
  <text x="95" y="152" text-anchor="middle" fill="#888898" font-size="10">no mesmo host</text>
  <text x="95" y="176" text-anchor="middle" fill="#e8c547" font-size="10" font-weight="700">gargalo: tudo cai</text>
  <text x="95" y="190" text-anchor="middle" fill="#e8c547" font-size="10" font-weight="700">junto</text>

  <line x1="172" y1="145" x2="196" y2="145" stroke="#888898" stroke-width="1.5" marker-end="url(#ev-arr)"/>

  <!-- stage 2 -->
  <rect x="198" y="90" width="150" height="110" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="273" y="114" text-anchor="middle" fill="#f0efe8" font-size="12" font-weight="700">+ load balancer</text>
  <text x="273" y="136" text-anchor="middle" fill="#888898" font-size="10">vários servidores</text>
  <text x="273" y="152" text-anchor="middle" fill="#888898" font-size="10">web, 1 banco</text>
  <text x="273" y="176" text-anchor="middle" fill="#e8c547" font-size="10" font-weight="700">gargalo: banco</text>
  <text x="273" y="190" text-anchor="middle" fill="#e8c547" font-size="10" font-weight="700">único</text>

  <line x1="350" y1="145" x2="374" y2="145" stroke="#888898" stroke-width="1.5" marker-end="url(#ev-arr)"/>

  <!-- stage 3 -->
  <rect x="376" y="90" width="150" height="110" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="451" y="114" text-anchor="middle" fill="#f0efe8" font-size="12" font-weight="700">+ réplicas de leitura</text>
  <text x="451" y="136" text-anchor="middle" fill="#888898" font-size="10">1 primary (escrita),</text>
  <text x="451" y="152" text-anchor="middle" fill="#888898" font-size="10">N réplicas (leitura)</text>
  <text x="451" y="176" text-anchor="middle" fill="#e8c547" font-size="10" font-weight="700">gargalo: latência</text>
  <text x="451" y="190" text-anchor="middle" fill="#e8c547" font-size="10" font-weight="700">de conteúdo repetido</text>

  <line x1="528" y1="145" x2="552" y2="145" stroke="#888898" stroke-width="1.5" marker-end="url(#ev-arr)"/>

  <!-- stage 4 -->
  <rect x="554" y="90" width="150" height="110" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="629" y="114" text-anchor="middle" fill="#f0efe8" font-size="12" font-weight="700">+ cache e CDN</text>
  <text x="629" y="136" text-anchor="middle" fill="#888898" font-size="10">cache tira carga do</text>
  <text x="629" y="152" text-anchor="middle" fill="#888898" font-size="10">banco, CDN serve</text>
  <text x="629" y="168" text-anchor="middle" fill="#888898" font-size="10">estático</text>
  <text x="629" y="188" text-anchor="middle" fill="#e8c547" font-size="10" font-weight="700">gargalo: sessão presa</text>

  <line x1="706" y1="145" x2="730" y2="145" stroke="#888898" stroke-width="1.5" marker-end="url(#ev-arr)"/>

  <!-- stage 5 -->
  <rect x="732" y="90" width="190" height="110" rx="12" fill="#0f766e" fill-opacity="0.18" stroke="#0f766e" stroke-width="1.5"/>
  <text x="827" y="114" text-anchor="middle" fill="#2dd4bf" font-size="12" font-weight="700">+ stateless, fila,</text>
  <text x="827" y="130" text-anchor="middle" fill="#2dd4bf" font-size="12" font-weight="700">multi-datacenter, shard</text>
  <text x="827" y="152" text-anchor="middle" fill="#888898" font-size="10">sessão fora do servidor,</text>
  <text x="827" y="168" text-anchor="middle" fill="#888898" font-size="10">fila para trabalho pesado,</text>
  <text x="827" y="184" text-anchor="middle" fill="#888898" font-size="10">banco dividido por shard</text>

  <text x="470" y="240" text-anchor="middle" fill="#888898" font-size="11">acompanhando cada estágio: logging, métrica e automação (CI/CD) — sem eles, ninguém enxerga o próximo gargalo</text>
  <text x="470" y="262" text-anchor="middle" fill="#888898" font-size="11">o servidor de banco de dados costuma ser o primeiro a precisar de separação do servidor de aplicação, ainda no estágio 1→2</text>
</svg>
