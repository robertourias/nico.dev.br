<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#888898"/>
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7b61ff"/>
    </marker>
    <marker id="arrYellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8c547"/>
    </marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="800" height="440" fill="#0a0a0f"/>

  <text x="400" y="32" text-anchor="middle" fill="#f0efe8" font-size="20" font-weight="700">Um fluxo combinado de observabilidade</text>

  <!-- App -->
  <rect x="30" y="175" width="170" height="110" rx="14" fill="#111118" stroke="#ffffff14"/>
  <text x="115" y="204" text-anchor="middle" fill="#f0efe8" font-size="14" font-weight="700">Sua aplicação</text>
  <text x="115" y="232" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="600">SDK OpenTelemetry</text>
  <text x="115" y="252" text-anchor="middle" fill="#e8c547" font-size="11" font-weight="600">SDK Sentry</text>

  <!-- Collector -->
  <rect x="290" y="175" width="170" height="110" rx="14" fill="#7b61ff" fill-opacity="0.14" stroke="#7b61ff" stroke-width="1.5"/>
  <text x="375" y="204" text-anchor="middle" fill="#f0efe8" font-size="14" font-weight="700">OTel Collector</text>
  <text x="375" y="230" text-anchor="middle" fill="#a78bfa" font-size="10">receivers</text>
  <text x="375" y="246" text-anchor="middle" fill="#a78bfa" font-size="10">→ processors</text>
  <text x="375" y="262" text-anchor="middle" fill="#a78bfa" font-size="10">→ exporters</text>

  <!-- Grafana -->
  <rect x="580" y="44" width="190" height="122" rx="14" fill="#0f766e" fill-opacity="0.15" stroke="#0f766e" stroke-width="1.5"/>
  <text x="675" y="70" text-anchor="middle" fill="#2dd4bf" font-size="14" font-weight="700">Grafana stack</text>
  <text x="675" y="94" text-anchor="middle" fill="#f0efe8" font-size="11">Tempo · traces</text>
  <text x="675" y="112" text-anchor="middle" fill="#f0efe8" font-size="11">Mimir · métricas</text>
  <text x="675" y="130" text-anchor="middle" fill="#f0efe8" font-size="11">Loki · logs</text>
  <text x="675" y="150" text-anchor="middle" fill="#888898" font-size="10">Grafana · dashboards</text>

  <!-- Datadog -->
  <rect x="580" y="196" width="190" height="68" rx="14" fill="#f0efe8" fill-opacity="0.07" stroke="#f0efe8" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="675" y="224" text-anchor="middle" fill="#f0efe8" font-size="14" font-weight="700">Datadog</text>
  <text x="675" y="244" text-anchor="middle" fill="#888898" font-size="10">alternativa ao Grafana stack</text>

  <!-- Sentry -->
  <rect x="580" y="304" width="190" height="72" rx="14" fill="#e8c547" fill-opacity="0.1" stroke="#e8c547" stroke-width="1.5"/>
  <text x="675" y="332" text-anchor="middle" fill="#e8c547" font-size="14" font-weight="700">Sentry</text>
  <text x="675" y="352" text-anchor="middle" fill="#888898" font-size="10">erros, releases, replay</text>

  <!-- App -> Collector -->
  <line x1="200" y1="230" x2="286" y2="230" stroke="#7b61ff" stroke-width="1.5" marker-end="url(#arrPurple)"/>
  <text x="243" y="220" text-anchor="middle" fill="#a78bfa" font-size="11" font-weight="600">OTLP</text>

  <!-- Collector -> Grafana / Datadog -->
  <line x1="460" y1="230" x2="515" y2="230" stroke="#888898" stroke-width="1.5"/>
  <path d="M515 230 L515 105 L576 105" fill="none" stroke="#0f766e" stroke-width="1.5" marker-end="url(#arrTeal)"/>
  <line x1="515" y1="230" x2="576" y2="230" stroke="#888898" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="515" y="90" text-anchor="middle" fill="#888898" font-size="10" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">métricas, logs, traces</text>
  <text x="547" y="222" text-anchor="middle" fill="#888898" font-size="10" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">ou</text>

  <!-- App -> Sentry -->
  <path d="M115 285 L115 340 L576 340" fill="none" stroke="#e8c547" stroke-width="1.5" marker-end="url(#arrYellow)"/>
  <text x="345" y="330" text-anchor="middle" fill="#e8c547" font-size="11" font-weight="600" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">o SDK do Sentry envia os erros direto</text>

  <!-- Caption -->
  <rect x="150" y="394" width="500" height="30" rx="8" fill="#111118" stroke="#ffffff14"/>
  <text x="400" y="414" text-anchor="middle" fill="#888898" font-size="12">o Collector desacopla a aplicação do backend: trocar o destino é mudar configuração</text>
</svg>
