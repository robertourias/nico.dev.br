<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" font-family="'Inter', 'Segoe UI', sans-serif">
  <defs>
    <marker id="s3-arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888898"/>
    </marker>
    <marker id="s3-arr-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8c547"/>
    </marker>
    <marker id="s3-arr-p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7b61ff"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="400" fill="#0a0a0f"/>
  <text x="470" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#f0efe8">Padrão recomendado: bucket privado + CloudFront com OAC</text>
  <text x="470" y="54" text-anchor="middle" font-size="12" fill="#888898">o bucket nunca é público — só o CloudFront tem permissão de ler</text>

  <!-- browser -->
  <rect x="20" y="110" width="140" height="80" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="90" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#f0efe8">Navegador</text>
  <text x="90" y="160" text-anchor="middle" font-size="11" fill="#888898">do usuário</text>

  <line x1="162" y1="140" x2="198" y2="140" stroke="#e8c547" stroke-width="1.5" marker-end="url(#s3-arr-y)"/>
  <text x="180" y="128" text-anchor="middle" font-size="10" fill="#e8c547">HTTPS</text>

  <!-- cloudfront -->
  <rect x="200" y="90" width="200" height="130" rx="14" fill="#111118" stroke="#e8c547" stroke-width="1.5"/>
  <text x="300" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#e8c547">CloudFront</text>
  <text x="300" y="142" text-anchor="middle" font-size="11" fill="#888898">edge location mais</text>
  <text x="300" y="158" text-anchor="middle" font-size="11" fill="#888898">próxima do usuário</text>
  <text x="300" y="180" text-anchor="middle" font-size="10" fill="#888898">cache por TTL/cache policy</text>
  <text x="300" y="196" text-anchor="middle" font-size="10" fill="#888898">certificado ACM (us-east-1)</text>

  <line x1="402" y1="155" x2="438" y2="155" stroke="#888898" stroke-width="1.5" marker-end="url(#s3-arr-g)"/>
  <text x="420" y="143" text-anchor="middle" font-size="10" fill="#888898">cache miss</text>

  <!-- OAC -->
  <rect x="440" y="130" width="130" height="50" rx="10" fill="#0f766e" fill-opacity="0.18" stroke="#0f766e" stroke-width="1.5"/>
  <text x="505" y="152" text-anchor="middle" font-size="11" font-weight="700" fill="#2dd4bf">OAC assina</text>
  <text x="505" y="168" text-anchor="middle" font-size="10" fill="#2dd4bf">a requisição</text>

  <line x1="572" y1="155" x2="608" y2="155" stroke="#888898" stroke-width="1.5" marker-end="url(#s3-arr-g)"/>

  <!-- bucket -->
  <rect x="610" y="90" width="180" height="130" rx="14" fill="#111118" stroke="#ffffff14"/>
  <text x="700" y="118" text-anchor="middle" font-size="13" font-weight="700" fill="#f0efe8">Bucket S3</text>
  <text x="700" y="142" text-anchor="middle" font-size="10" fill="#888898">Block Public Access: ON</text>
  <text x="700" y="158" text-anchor="middle" font-size="10" fill="#888898">bucket policy só permite</text>
  <text x="700" y="174" text-anchor="middle" font-size="10" fill="#888898">s3:GetObject do CloudFront</text>
  <text x="700" y="196" text-anchor="middle" font-size="10" fill="#e8c547" font-weight="700">nunca acessível direto</text>

  <!-- upload path (presigned) -->
  <path d="M90,190 L90,300 L700,300 L700,222" fill="none" stroke="#7b61ff" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#s3-arr-p)"/>
  <text x="395" y="292" text-anchor="middle" font-size="11" fill="#a78bfa">upload via presigned URL — direto do navegador, sem passar pelo backend</text>

  <!-- backend -->
  <rect x="380" y="320" width="160" height="60" rx="12" fill="#111118" stroke="#7b61ff" stroke-width="1.5"/>
  <text x="460" y="345" text-anchor="middle" font-size="12" font-weight="700" fill="#a78bfa">Backend</text>
  <text x="460" y="363" text-anchor="middle" font-size="10" fill="#888898">gera a presigned URL</text>
  <line x1="90" y1="192" x2="380" y2="340" stroke="#7b61ff" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="200" y="230" text-anchor="middle" font-size="10" fill="#a78bfa" transform="rotate(24 200 230)">pede autorização</text>
</svg>
