<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Inter', 'Segoe UI', sans-serif">
  <defs>
    <marker id="sh-arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888898"/>
    </marker>
    <marker id="sh-arr-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/>
    </marker>
  </defs>
  <rect width="900" height="460" fill="#0a0a0f"/>
  <text x="450" y="34" text-anchor="middle" fill="#f0efe8" font-size="20" font-weight="700">Escala horizontal: Postgres precisa de ajuda, MongoDB nasceu com isso</text>

  <!-- Left panel: Postgres -->
  <rect x="30" y="56" width="400" height="380" rx="14" fill="#111118" stroke="#ffffff14"/>
  <text x="230" y="84" text-anchor="middle" fill="#e8c547" font-size="13" font-weight="700">PostgreSQL</text>

  <rect x="150" y="100" width="160" height="42" rx="10" fill="#0a0a0f" stroke="#e8c547"/>
  <text x="230" y="126" text-anchor="middle" fill="#f0efe8" font-size="12">Primary (leitura + escrita)</text>

  <line x1="180" y1="142" x2="120" y2="176" stroke="#888898" stroke-width="1.5" marker-end="url(#sh-arr-g)"/>
  <line x1="280" y1="142" x2="340" y2="176" stroke="#888898" stroke-width="1.5" marker-end="url(#sh-arr-g)"/>
  <text x="230" y="160" text-anchor="middle" fill="#888898" font-size="10">streaming replication</text>

  <rect x="50" y="180" width="140" height="40" rx="10" fill="#0a0a0f" stroke="#ffffff14"/>
  <text x="120" y="204" text-anchor="middle" fill="#888898" font-size="11">Réplica (leitura)</text>
  <rect x="270" y="180" width="140" height="40" rx="10" fill="#0a0a0f" stroke="#ffffff14"/>
  <text x="340" y="204" text-anchor="middle" fill="#888898" font-size="11">Réplica (leitura)</text>

  <line x1="230" y1="220" x2="230" y2="248" stroke="#888898" stroke-width="1.5" marker-end="url(#sh-arr-g)"/>
  <text x="230" y="270" text-anchor="middle" fill="#888898" font-size="10">além da réplica: distribuir escrita</text>

  <rect x="50" y="284" width="360" height="34" rx="10" fill="#0a0a0f" stroke="#ffffff14" stroke-dasharray="4 3"/>
  <text x="230" y="306" text-anchor="middle" fill="#888898" font-size="11">particionamento nativo — 1 tabela, 1 nó</text>

  <rect x="50" y="330" width="360" height="86" rx="12" fill="#0a0a0f" stroke="#e8c547" stroke-dasharray="4 3"/>
  <text x="230" y="352" text-anchor="middle" fill="#e8c547" font-size="11" font-weight="700">sharding via extensão (ex.: Citus)</text>
  <rect x="65" y="366" width="100" height="34" rx="8" fill="#111118" stroke="#e8c547"/>
  <text x="115" y="388" text-anchor="middle" fill="#f0efe8" font-size="10">Shard 1</text>
  <rect x="180" y="366" width="100" height="34" rx="8" fill="#111118" stroke="#e8c547"/>
  <text x="230" y="388" text-anchor="middle" fill="#f0efe8" font-size="10">Shard 2</text>
  <rect x="295" y="366" width="100" height="34" rx="8" fill="#111118" stroke="#e8c547"/>
  <text x="345" y="388" text-anchor="middle" fill="#f0efe8" font-size="10">Shard 3</text>

  <!-- Right panel: MongoDB -->
  <rect x="470" y="56" width="400" height="380" rx="14" fill="#111118" stroke="#ffffff14"/>
  <text x="670" y="84" text-anchor="middle" fill="#2dd4bf" font-size="13" font-weight="700">MongoDB</text>

  <rect x="590" y="100" width="160" height="40" rx="10" fill="#0a0a0f" stroke="#2dd4bf"/>
  <text x="670" y="124" text-anchor="middle" fill="#f0efe8" font-size="12">mongos (router)</text>

  <line x1="670" y1="140" x2="670" y2="168" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#sh-arr-t)"/>

  <rect x="570" y="172" width="200" height="40" rx="10" fill="#0a0a0f" stroke="#ffffff14"/>
  <text x="670" y="196" text-anchor="middle" fill="#888898" font-size="11">config servers (metadados)</text>

  <line x1="620" y1="212" x2="560" y2="248" stroke="#888898" stroke-width="1.5" marker-end="url(#sh-arr-g)"/>
  <line x1="670" y1="212" x2="670" y2="248" stroke="#888898" stroke-width="1.5" marker-end="url(#sh-arr-g)"/>
  <line x1="720" y1="212" x2="780" y2="248" stroke="#888898" stroke-width="1.5" marker-end="url(#sh-arr-g)"/>
  <text x="670" y="232" text-anchor="middle" fill="#888898" font-size="10">roteia por shard key</text>

  <rect x="500" y="252" width="120" height="52" rx="10" fill="#0a0a0f" stroke="#7b61ff"/>
  <text x="560" y="272" text-anchor="middle" fill="#f0efe8" font-size="10">Shard A</text>
  <text x="560" y="288" text-anchor="middle" fill="#a78bfa" font-size="9">replica set</text>

  <rect x="610" y="252" width="120" height="52" rx="10" fill="#0a0a0f" stroke="#7b61ff"/>
  <text x="670" y="272" text-anchor="middle" fill="#f0efe8" font-size="10">Shard B</text>
  <text x="670" y="288" text-anchor="middle" fill="#a78bfa" font-size="9">replica set</text>

  <rect x="720" y="252" width="120" height="52" rx="10" fill="#0a0a0f" stroke="#7b61ff"/>
  <text x="780" y="272" text-anchor="middle" fill="#f0efe8" font-size="10">Shard C</text>
  <text x="780" y="288" text-anchor="middle" fill="#a78bfa" font-size="9">replica set</text>

  <rect x="500" y="322" width="340" height="94" rx="12" fill="#0a0a0f" stroke="#2dd4bf" stroke-dasharray="4 3"/>
  <text x="670" y="344" text-anchor="middle" fill="#2dd4bf" font-size="11" font-weight="700">balanceamento automático de chunks</text>
  <text x="670" y="364" text-anchor="middle" fill="#888898" font-size="11">o cluster move dados entre shards</text>
  <text x="670" y="380" text-anchor="middle" fill="#888898" font-size="11">sozinho, conforme o volume cresce</text>
  <text x="670" y="400" text-anchor="middle" fill="#888898" font-size="11">— nativo, sem extensão externa</text>

  <text x="450" y="446" text-anchor="middle" fill="#888898" font-size="11">a escolha do shard key decide se essa distribuição fica equilibrada</text>
</svg>
