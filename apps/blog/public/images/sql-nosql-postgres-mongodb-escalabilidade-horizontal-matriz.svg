<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="'Inter', 'Segoe UI', sans-serif">
  <rect width="860" height="300" fill="#0a0a0f"/>
  <text x="430" y="34" text-anchor="middle" fill="#f0efe8" font-size="20" font-weight="700">SQL vs. NoSQL: o que muda na prática</text>
  <text x="430" y="54" text-anchor="middle" fill="#888898" font-size="12">célula destacada é o ponto de maior atrito de cada modelo</text>

  <!-- column headers -->
  <text x="241" y="82" text-anchor="middle" fill="#888898" font-size="10" font-weight="700">SCHEMA</text>
  <text x="413" y="82" text-anchor="middle" fill="#888898" font-size="10" font-weight="700">RELACIONAMENTOS</text>
  <text x="585" y="82" text-anchor="middle" fill="#888898" font-size="10" font-weight="700">CONSISTÊNCIA</text>
  <text x="757" y="82" text-anchor="middle" fill="#888898" font-size="10" font-weight="700">ESCALA HORIZONTAL</text>
  <line x1="30" y1="92" x2="830" y2="92" stroke="#ffffff14"/>

  <!-- row labels -->
  <text x="30" y="140" fill="#f0efe8" font-size="15" font-weight="700">SQL</text>
  <text x="30" y="156" fill="#888898" font-size="10">Postgres, MySQL</text>
  <text x="30" y="228" fill="#f0efe8" font-size="15" font-weight="700">NoSQL</text>
  <text x="30" y="244" fill="#888898" font-size="10">MongoDB, Cassandra</text>

  <!-- ROW SQL (y 106, h 70) -->
  <rect x="160" y="106" width="162" height="70" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="241" y="134" text-anchor="middle" fill="#888898" font-size="11">forte, definido</text>
  <text x="241" y="150" text-anchor="middle" fill="#888898" font-size="11">antes de gravar</text>

  <rect x="332" y="106" width="162" height="70" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="413" y="134" text-anchor="middle" fill="#888898" font-size="11">joins nativos</text>
  <text x="413" y="150" text-anchor="middle" fill="#888898" font-size="11">entre tabelas</text>

  <rect x="504" y="106" width="162" height="70" rx="12" fill="#e8c547" fill-opacity="0.12" stroke="#e8c547" stroke-width="1.5"/>
  <text x="585" y="134" text-anchor="middle" fill="#e8c547" font-size="12" font-weight="700">ACID —</text>
  <text x="585" y="150" text-anchor="middle" fill="#e8c547" font-size="12" font-weight="700">transactions</text>

  <rect x="676" y="106" width="162" height="70" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="757" y="130" text-anchor="middle" fill="#888898" font-size="11">difícil por padrão:</text>
  <text x="757" y="146" text-anchor="middle" fill="#888898" font-size="11">réplica + sharding</text>
  <text x="757" y="162" text-anchor="middle" fill="#888898" font-size="11">manual/extensão</text>

  <!-- ROW NoSQL (y 194, h 70) -->
  <rect x="160" y="194" width="162" height="70" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="241" y="222" text-anchor="middle" fill="#888898" font-size="11">flexível, por</text>
  <text x="241" y="238" text-anchor="middle" fill="#888898" font-size="11">documento/registro</text>

  <rect x="332" y="194" width="162" height="70" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="413" y="222" text-anchor="middle" fill="#888898" font-size="11">denormalizado,</text>
  <text x="413" y="238" text-anchor="middle" fill="#888898" font-size="11">sem join nativo</text>

  <rect x="504" y="194" width="162" height="70" rx="12" fill="#7b61ff" fill-opacity="0.12" stroke="#7b61ff" stroke-width="1.5"/>
  <text x="585" y="222" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="700">CAP —</text>
  <text x="585" y="238" text-anchor="middle" fill="#a78bfa" font-size="12" font-weight="700">escolhe C ou A</text>

  <rect x="676" y="194" width="162" height="70" rx="12" fill="#0f766e" fill-opacity="0.18" stroke="#0f766e" stroke-width="1.5"/>
  <text x="757" y="222" text-anchor="middle" fill="#2dd4bf" font-size="12" font-weight="700">nativa: sharding e</text>
  <text x="757" y="238" text-anchor="middle" fill="#2dd4bf" font-size="12" font-weight="700">partição automática</text>
</svg>
