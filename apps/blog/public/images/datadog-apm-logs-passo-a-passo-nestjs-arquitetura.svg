<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-labelledby="t d" font-family="'Inter', 'Segoe UI', sans-serif">
  <title id="t">Como os dados chegam ao Datadog</title>
  <desc id="d">A API NestJS com dd-trace envia traces ao Datadog Agent pela porta 8126. O Agent também lê os logs dos containers pelo disco do Docker e as métricas pelo socket do Docker. O Agent envia tudo ao Datadog por HTTPS, onde aparecem APM, Logs, Infraestrutura e Monitors.</desc>
  <defs>
    <marker id="dd-a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#888898"/>
    </marker>
    <marker id="dd-a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e8c547"/>
    </marker>
  </defs>
  <rect width="800" height="340" fill="#0a0a0f"/>
  <text x="400" y="38" font-size="20" font-weight="700" text-anchor="middle" fill="#f0efe8">Da API ao Datadog</text>

  <!-- host docker -->
  <rect x="24" y="60" width="500" height="250" rx="14" fill="none" stroke="#ffffff14" stroke-dasharray="6 4"/>
  <text x="40" y="82" font-size="11" fill="#888898">Host com Docker Compose</text>

  <rect x="50" y="110" width="170" height="90" rx="12" fill="#111118" stroke="#7b61ff"/>
  <text x="135" y="140" font-size="13" font-weight="700" text-anchor="middle" fill="#a78bfa">api-pedidos</text>
  <text x="135" y="160" font-size="11" text-anchor="middle" fill="#888898">NestJS + dd-trace</text>
  <text x="135" y="178" font-size="11" text-anchor="middle" fill="#888898">logs JSON no stdout</text>

  <rect x="340" y="110" width="170" height="90" rx="12" fill="#111118" stroke="#0f766e"/>
  <text x="425" y="140" font-size="13" font-weight="700" text-anchor="middle" fill="#2dd4bf">Datadog Agent</text>
  <text x="425" y="160" font-size="11" text-anchor="middle" fill="#888898">traces, logs, métricas</text>
  <text x="425" y="178" font-size="11" text-anchor="middle" fill="#888898">do host e dos containers</text>

  <line x1="222" y1="140" x2="338" y2="140" stroke="#e8c547" stroke-width="1.8" marker-end="url(#dd-a2)"/>
  <text x="280" y="130" font-size="11" text-anchor="middle" fill="#e8c547" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">traces :8126</text>

  <rect x="50" y="236" width="460" height="48" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="280" y="256" font-size="12" text-anchor="middle" fill="#f0efe8">Docker: socket + /var/lib/docker/containers</text>
  <text x="280" y="274" font-size="11" text-anchor="middle" fill="#888898">o Agent lê logs e metadados dos containers</text>
  <line x1="425" y1="234" x2="425" y2="202" stroke="#888898" stroke-width="1.8" marker-end="url(#dd-a1)"/>

  <!-- datadog -->
  <line x1="512" y1="155" x2="598" y2="155" stroke="#e8c547" stroke-width="1.8" marker-end="url(#dd-a2)"/>
  <text x="555" y="145" font-size="11" text-anchor="middle" fill="#e8c547" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">HTTPS</text>

  <rect x="600" y="80" width="176" height="220" rx="12" fill="#111118" stroke="#e8c547"/>
  <text x="688" y="110" font-size="13" font-weight="700" text-anchor="middle" fill="#e8c547">Datadog (SaaS)</text>
  <text x="688" y="150" font-size="12" text-anchor="middle" fill="#f0efe8">APM</text>
  <text x="688" y="180" font-size="12" text-anchor="middle" fill="#f0efe8">Logs</text>
  <text x="688" y="210" font-size="12" text-anchor="middle" fill="#f0efe8">Infraestrutura</text>
  <text x="688" y="240" font-size="12" text-anchor="middle" fill="#f0efe8">Monitors</text>
  <text x="688" y="278" font-size="11" text-anchor="middle" fill="#888898">ligados por service/env/version</text>
</svg>
