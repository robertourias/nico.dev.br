<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" font-family="'Inter', 'Segoe UI', sans-serif">
  <defs>
    <marker id="sbds-arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888898"/>
    </marker>
    <marker id="sbds-arr-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8c547"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="330" fill="#0a0a0f"/>
  <text x="470" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#f0efe8">As camadas de um design system no Storybook</text>

  <rect x="20" y="70" width="190" height="100" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="115" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#f0efe8">1 · Tokens</text>
  <text x="115" y="122" text-anchor="middle" font-size="11" fill="#888898">cores, espaços, tipografia</text>
  <text x="115" y="138" text-anchor="middle" font-size="11" fill="#888898">como variáveis CSS</text>
  <line x1="212" y1="120" x2="249" y2="120" stroke="#888898" stroke-width="1.5" marker-end="url(#sbds-arr-g)"/>

  <rect x="251" y="70" width="190" height="100" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="346" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#f0efe8">2 · Componentes</text>
  <text x="346" y="122" text-anchor="middle" font-size="11" fill="#888898">Button, Input...</text>
  <text x="346" y="138" text-anchor="middle" font-size="11" fill="#888898">só consomem tokens</text>
  <line x1="443" y1="120" x2="480" y2="120" stroke="#888898" stroke-width="1.5" marker-end="url(#sbds-arr-g)"/>

  <rect x="482" y="70" width="190" height="100" rx="12" fill="#111118" stroke="#e8c547" stroke-width="1.5"/>
  <text x="577" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#e8c547">3 · Stories</text>
  <text x="577" y="122" text-anchor="middle" font-size="11" fill="#888898">um estado do componente</text>
  <text x="577" y="138" text-anchor="middle" font-size="11" fill="#888898">por story, em *.stories.tsx</text>
  <line x1="674" y1="120" x2="711" y2="120" stroke="#e8c547" stroke-width="1.5" marker-end="url(#sbds-arr-y)"/>

  <rect x="713" y="70" width="207" height="100" rx="12" fill="#0f766e" fill-opacity="0.18" stroke="#0f766e" stroke-width="1.5"/>
  <text x="816" y="98" text-anchor="middle" font-size="12" font-weight="700" fill="#2dd4bf">4 · Site publicado</text>
  <text x="816" y="122" text-anchor="middle" font-size="11" fill="#888898">build-storybook gera</text>
  <text x="816" y="138" text-anchor="middle" font-size="11" fill="#888898">HTML estático</text>

  <line x1="577" y1="172" x2="577" y2="200" stroke="#888898" stroke-width="1.5" marker-end="url(#sbds-arr-g)"/>

  <rect x="260" y="202" width="150" height="70" rx="12" fill="#111118" stroke="#7b61ff" stroke-width="1.5"/>
  <text x="335" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#a78bfa">Controls</text>
  <text x="335" y="250" text-anchor="middle" font-size="11" fill="#888898">mexer nas props</text>

  <rect x="425" y="202" width="150" height="70" rx="12" fill="#111118" stroke="#7b61ff" stroke-width="1.5"/>
  <text x="500" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#a78bfa">Docs</text>
  <text x="500" y="250" text-anchor="middle" font-size="11" fill="#888898">página automática</text>

  <rect x="590" y="202" width="170" height="70" rx="12" fill="#111118" stroke="#7b61ff" stroke-width="1.5"/>
  <text x="675" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#a78bfa">Play function</text>
  <text x="675" y="250" text-anchor="middle" font-size="11" fill="#888898">teste de interação</text>

  <text x="470" y="308" text-anchor="middle" font-size="11" fill="#888898">cada story alimenta os três recursos, sem escrever documentação ou teste à parte</text>
</svg>
