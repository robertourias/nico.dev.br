<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 410" font-family="'Inter', 'Segoe UI', sans-serif">
  <defs>
    <marker id="iso-arr-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8c547"/>
    </marker>
    <marker id="iso-arr-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="410" fill="#0a0a0f"/>
  <text x="400" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#f0efe8">Mesma árvore vs. um worktree por agente</text>

  <!-- Painel esquerdo: árvore única -->
  <rect x="30" y="60" width="350" height="320" rx="14" fill="#111118" stroke="#ffffff14"/>
  <text x="205" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#e8c547">Árvore única</text>

  <rect x="55" y="104" width="300" height="150" rx="12" fill="#0a0a0f" stroke="#888898" stroke-dasharray="5 4"/>
  <text x="205" y="124" text-anchor="middle" font-size="11" fill="#888898">uma pasta, uma branch, um índice</text>
  <rect x="75" y="138" width="260" height="34" rx="8" fill="#111118" stroke="#e8c547"/>
  <text x="205" y="160" text-anchor="middle" font-size="12" fill="#f0efe8">packages/types/index.ts</text>
  <rect x="75" y="192" width="120" height="30" rx="8" fill="#111118" stroke="#ffffff14"/>
  <text x="135" y="212" text-anchor="middle" font-size="11" fill="#888898">api/search.ts</text>
  <rect x="215" y="192" width="120" height="30" rx="8" fill="#111118" stroke="#ffffff14"/>
  <text x="275" y="212" text-anchor="middle" font-size="11" fill="#888898">web/Search.tsx</text>

  <rect x="55" y="286" width="130" height="40" rx="10" fill="#111118" stroke="#7b61ff"/>
  <text x="120" y="311" text-anchor="middle" font-size="12" fill="#a78bfa">Agente T2</text>
  <rect x="225" y="286" width="130" height="40" rx="10" fill="#111118" stroke="#7b61ff"/>
  <text x="290" y="311" text-anchor="middle" font-size="12" fill="#a78bfa">Agente T3</text>
  <line x1="120" y1="284" x2="120" y2="258" stroke="#e8c547" stroke-width="1.5" marker-end="url(#iso-arr-y)"/>
  <line x1="290" y1="284" x2="290" y2="258" stroke="#e8c547" stroke-width="1.5" marker-end="url(#iso-arr-y)"/>

  <text x="205" y="350" text-anchor="middle" font-size="11" fill="#888898">os dois escrevem na mesma pasta</text>
  <text x="205" y="367" text-anchor="middle" font-size="11" fill="#888898">teste de um roda no código pela metade do outro</text>

  <!-- Painel direito: worktrees -->
  <rect x="420" y="60" width="350" height="320" rx="14" fill="#111118" stroke="#ffffff14"/>
  <text x="595" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#2dd4bf">Um worktree por agente</text>

  <rect x="445" y="106" width="300" height="40" rx="10" fill="#0a0a0f" stroke="#0f766e"/>
  <text x="595" y="131" text-anchor="middle" font-size="12" fill="#2dd4bf">um .git: objetos e branches</text>

  <line x1="515" y1="148" x2="515" y2="186" stroke="#0f766e" stroke-width="1.5" marker-end="url(#iso-arr-t)"/>
  <line x1="675" y1="148" x2="675" y2="186" stroke="#0f766e" stroke-width="1.5" marker-end="url(#iso-arr-t)"/>

  <rect x="445" y="190" width="140" height="120" rx="12" fill="#0a0a0f" stroke="#ffffff14"/>
  <text x="515" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#f0efe8">wt-t2</text>
  <text x="515" y="231" text-anchor="middle" font-size="11" fill="#888898">feat/x-t2</text>
  <rect x="457" y="252" width="116" height="40" rx="10" fill="#111118" stroke="#7b61ff"/>
  <text x="515" y="277" text-anchor="middle" font-size="12" fill="#a78bfa">Agente T2</text>

  <rect x="605" y="190" width="140" height="120" rx="12" fill="#0a0a0f" stroke="#ffffff14"/>
  <text x="675" y="214" text-anchor="middle" font-size="12" font-weight="700" fill="#f0efe8">wt-t3</text>
  <text x="675" y="231" text-anchor="middle" font-size="11" fill="#888898">feat/x-t3</text>
  <rect x="617" y="252" width="116" height="40" rx="10" fill="#111118" stroke="#7b61ff"/>
  <text x="675" y="277" text-anchor="middle" font-size="12" fill="#a78bfa">Agente T3</text>

  <text x="595" y="341" text-anchor="middle" font-size="11" fill="#888898">cada agente vê só a própria árvore</text>
  <text x="595" y="358" text-anchor="middle" font-size="11" fill="#e8c547">conflito aparece no merge, não no meio da tarefa</text>
</svg>
