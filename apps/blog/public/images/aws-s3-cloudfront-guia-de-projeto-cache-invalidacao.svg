<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" font-family="'Inter', 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="900" height="370" fill="#0a0a0f"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#f0efe8">Deploy novo: invalidar cache ou versionar nome de arquivo</text>

  <!-- left: invalidation -->
  <rect x="30" y="66" width="400" height="270" rx="14" fill="#111118" stroke="#e8c547" stroke-width="1.5"/>
  <text x="230" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#e8c547">Invalidação</text>

  <rect x="60" y="108" width="340" height="34" rx="8" fill="#0a0a0f" stroke="#ffffff14"/>
  <text x="230" y="130" text-anchor="middle" font-size="11" fill="#f0efe8">deploy sobrescreve /app.js no bucket</text>

  <rect x="60" y="154" width="340" height="34" rx="8" fill="#0a0a0f" stroke="#ffffff14"/>
  <text x="230" y="176" text-anchor="middle" font-size="11" fill="#f0efe8">chama CreateInvalidation em /app.js</text>

  <rect x="60" y="200" width="340" height="34" rx="8" fill="#0a0a0f" stroke="#ffffff14"/>
  <text x="230" y="222" text-anchor="middle" font-size="11" fill="#f0efe8">CloudFront limpa esse caminho</text>
  <text x="230" y="234" text-anchor="middle" font-size="10" fill="#888898">em cada edge location</text>

  <text x="230" y="270" text-anchor="middle" font-size="11" fill="#e8c547" font-weight="700">custo por caminho invalidado</text>
  <text x="230" y="288" text-anchor="middle" font-size="11" fill="#888898">janela curta de inconsistência</text>
  <text x="230" y="304" text-anchor="middle" font-size="11" fill="#888898">entre edges durante a propagação</text>

  <!-- right: versioned filenames -->
  <rect x="470" y="66" width="400" height="270" rx="14" fill="#0f766e" fill-opacity="0.18" stroke="#0f766e" stroke-width="1.5"/>
  <text x="670" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#2dd4bf">Nome de arquivo versionado</text>

  <rect x="500" y="108" width="340" height="34" rx="8" fill="#0a0a0f" stroke="#ffffff14"/>
  <text x="670" y="130" text-anchor="middle" font-size="11" fill="#f0efe8">build gera /app.a1b2c3.js</text>

  <rect x="500" y="154" width="340" height="34" rx="8" fill="#0a0a0f" stroke="#ffffff14"/>
  <text x="670" y="176" text-anchor="middle" font-size="11" fill="#f0efe8">HTML novo referencia o hash novo</text>

  <rect x="500" y="200" width="340" height="34" rx="8" fill="#0a0a0f" stroke="#ffffff14"/>
  <text x="670" y="222" text-anchor="middle" font-size="11" fill="#f0efe8">arquivo antigo continua em cache,</text>
  <text x="670" y="234" text-anchor="middle" font-size="10" fill="#888898">mas ninguém mais pede por ele</text>

  <text x="670" y="270" text-anchor="middle" font-size="11" fill="#2dd4bf" font-weight="700">sem custo de invalidação</text>
  <text x="670" y="288" text-anchor="middle" font-size="11" fill="#888898">sem janela de inconsistência</text>
  <text x="670" y="304" text-anchor="middle" font-size="11" fill="#888898">só o HTML precisa de TTL curto</text>

  <text x="450" y="356" text-anchor="middle" font-size="11" fill="#888898">a maioria dos frameworks de build já versiona assets — reserve a invalidação pra HTML e pra emergência</text>
</svg>
