<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 270" font-family="'Inter', 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="740" height="270" fill="#0a0a0f"/>
  <text x="370" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#f0efe8">As três partes de um JWT</text>

  <rect x="20" y="62" width="210" height="130" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="125" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#f0efe8">1 · Header</text>
  <text x="125" y="116" text-anchor="middle" font-size="11" fill="#888898">{"alg":"HS256",</text>
  <text x="125" y="132" text-anchor="middle" font-size="11" fill="#888898">"typ":"JWT"}</text>
  <text x="125" y="162" text-anchor="middle" font-size="11" fill="#888898">algoritmo da assinatura</text>

  <text x="247" y="136" text-anchor="middle" font-size="28" font-weight="700" fill="#888898">.</text>

  <rect x="265" y="62" width="210" height="130" rx="12" fill="#111118" stroke="#e8c547" stroke-width="1.5"/>
  <text x="370" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#e8c547">2 · Payload</text>
  <text x="370" y="112" text-anchor="middle" font-size="11" fill="#888898">"sub":"42"</text>
  <text x="370" y="128" text-anchor="middle" font-size="11" fill="#888898">"role":"user"</text>
  <text x="370" y="144" text-anchor="middle" font-size="11" fill="#888898">"exp":1760000900</text>
  <text x="370" y="170" text-anchor="middle" font-size="11" fill="#888898">claims: quem é e até quando vale</text>

  <text x="492" y="136" text-anchor="middle" font-size="28" font-weight="700" fill="#888898">.</text>

  <rect x="510" y="62" width="210" height="130" rx="12" fill="#0f766e" fill-opacity="0.18" stroke="#0f766e" stroke-width="1.5"/>
  <text x="615" y="90" text-anchor="middle" font-size="12" font-weight="700" fill="#2dd4bf">3 · Assinatura</text>
  <text x="615" y="116" text-anchor="middle" font-size="11" fill="#888898">HMAC-SHA256 de</text>
  <text x="615" y="132" text-anchor="middle" font-size="11" fill="#888898">header.payload</text>
  <text x="615" y="162" text-anchor="middle" font-size="11" fill="#888898">usando o segredo do servidor</text>

  <line x1="20" y1="214" x2="475" y2="214" stroke="#888898" stroke-width="1.5"/>
  <text x="247" y="238" text-anchor="middle" font-size="11" fill="#888898">só Base64URL: qualquer pessoa consegue ler</text>
  <line x1="510" y1="214" x2="720" y2="214" stroke="#0f766e" stroke-width="1.5"/>
  <text x="615" y="238" text-anchor="middle" font-size="11" fill="#888898">só quem tem o segredo gera</text>
</svg>
