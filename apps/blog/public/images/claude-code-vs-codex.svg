<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', 'Segoe UI', sans-serif">
  <!-- Background -->
  <rect width="800" height="420" fill="#0f0f13"/>

  <!-- Left panel: Claude Code -->
  <rect x="40" y="40" width="330" height="340" rx="16" fill="#1a1a2e" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- Glow -->
  <rect x="40" y="40" width="330" height="340" rx="16" fill="url(#glowLeft)" opacity="0.15"/>

  <!-- Right panel: Codex -->
  <rect x="430" y="40" width="330" height="340" rx="16" fill="#0d1a2e" stroke="#0ea5e9" stroke-width="1.5"/>
  <rect x="430" y="40" width="330" height="340" rx="16" fill="url(#glowRight)" opacity="0.15"/>

  <!-- VS badge -->
  <circle cx="400" cy="210" r="28" fill="#1f1f2e" stroke="#444" stroke-width="1.5"/>
  <text x="400" y="216" text-anchor="middle" fill="#aaa" font-size="14" font-weight="700">VS</text>

  <!-- Gradients -->
  <defs>
    <radialGradient id="glowLeft" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Claude Code label -->
  <rect x="60" y="60" width="160" height="30" rx="8" fill="#7c3aed" opacity="0.9"/>
  <text x="140" y="80" text-anchor="middle" fill="white" font-size="13" font-weight="700">Claude Code</text>

  <!-- Claude Code terminal icon -->
  <text x="265" y="82" fill="#a78bfa" font-size="20">⌘</text>

  <!-- Claude Code features -->
  <text x="60" y="130" fill="#e2d9f3" font-size="13" font-weight="600">Pontos fortes</text>
  <line x1="60" y1="138" x2="350" y2="138" stroke="#7c3aed" stroke-width="0.5" opacity="0.5"/>

  <text x="72" y="162" fill="#c4b5fd" font-size="12">✦</text>
  <text x="88" y="162" fill="#e2d9f3" font-size="12">Contexto longo de codebase</text>

  <text x="72" y="186" fill="#c4b5fd" font-size="12">✦</text>
  <text x="88" y="186" fill="#e2d9f3" font-size="12">Raciocínio arquitetural</text>

  <text x="72" y="210" fill="#c4b5fd" font-size="12">✦</text>
  <text x="88" y="210" fill="#e2d9f3" font-size="12">Refatoração com segurança</text>

  <text x="72" y="234" fill="#c4b5fd" font-size="12">✦</text>
  <text x="88" y="234" fill="#e2d9f3" font-size="12">Hooks e slash commands</text>

  <text x="60" y="268" fill="#e2d9f3" font-size="13" font-weight="600">Ideal para</text>
  <line x1="60" y1="276" x2="350" y2="276" stroke="#7c3aed" stroke-width="0.5" opacity="0.5"/>
  <text x="60" y="298" fill="#a78bfa" font-size="12">Next.js App Router, projetos</text>
  <text x="60" y="316" fill="#a78bfa" font-size="12">complexos, decisões técnicas</text>

  <!-- Codex label -->
  <rect x="450" y="60" width="130" height="30" rx="8" fill="#0ea5e9" opacity="0.9"/>
  <text x="515" y="80" text-anchor="middle" fill="white" font-size="13" font-weight="700">Codex CLI</text>

  <!-- Codex robot icon -->
  <text x="620" y="82" fill="#38bdf8" font-size="18">⚡</text>

  <!-- Codex features -->
  <text x="450" y="130" fill="#e0f2fe" font-size="13" font-weight="600">Pontos fortes</text>
  <line x1="450" y1="138" x2="740" y2="138" stroke="#0ea5e9" stroke-width="0.5" opacity="0.5"/>

  <text x="462" y="162" fill="#38bdf8" font-size="12">✦</text>
  <text x="478" y="162" fill="#e0f2fe" font-size="12">Sandboxed por padrão</text>

  <text x="462" y="186" fill="#38bdf8" font-size="12">✦</text>
  <text x="478" y="186" fill="#e0f2fe" font-size="12">Multiagente paralelo</text>

  <text x="462" y="210" fill="#38bdf8" font-size="12">✦</text>
  <text x="478" y="210" fill="#e0f2fe" font-size="12">Git-aware nativo</text>

  <text x="462" y="234" fill="#38bdf8" font-size="12">✦</text>
  <text x="478" y="234" fill="#e0f2fe" font-size="12">Execução de tarefas isoladas</text>

  <text x="450" y="268" fill="#e0f2fe" font-size="13" font-weight="600">Ideal para</text>
  <line x1="450" y1="276" x2="740" y2="276" stroke="#0ea5e9" stroke-width="0.5" opacity="0.5"/>
  <text x="450" y="298" fill="#38bdf8" font-size="12">Componentes React isolados,</text>
  <text x="450" y="316" fill="#38bdf8" font-size="12">tarefas paralelas, automações</text>

  <!-- Bottom: React / Next.js badge -->
  <rect x="255" y="360" width="290" height="30" rx="8" fill="#1f1f2e" stroke="#444" stroke-width="1"/>
  <text x="400" y="380" text-anchor="middle" fill="#9ca3af" font-size="12">Ambos funcionam com React &amp; Next.js ⚛</text>
</svg>
