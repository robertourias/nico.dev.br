<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="'Inter', 'Segoe UI', sans-serif">
  <defs>
    <marker id="acm-val-seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#888898"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="330" fill="#0a0a0f"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#f0efe8">Validação por DNS: como o ACM confirma que o domínio é seu</text>

  <!-- step 1 -->
  <rect x="20" y="70" width="156" height="150" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="98" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#e8c547">1. Pedido</text>
  <text x="98" y="124" text-anchor="middle" font-size="11" fill="#f0efe8">você solicita</text>
  <text x="98" y="140" text-anchor="middle" font-size="11" fill="#f0efe8">meusite.com.br e</text>
  <text x="98" y="156" text-anchor="middle" font-size="11" fill="#f0efe8">*.meusite.com.br</text>
  <text x="98" y="182" text-anchor="middle" font-size="10" fill="#888898">status: Pending</text>
  <text x="98" y="196" text-anchor="middle" font-size="10" fill="#888898">validation</text>

  <!-- step 2 -->
  <rect x="196" y="70" width="156" height="150" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="274" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#e8c547">2. Desafio</text>
  <text x="274" y="124" text-anchor="middle" font-size="11" fill="#f0efe8">ACM gera um</text>
  <text x="274" y="140" text-anchor="middle" font-size="11" fill="#f0efe8">registro CNAME</text>
  <text x="274" y="156" text-anchor="middle" font-size="11" fill="#f0efe8">com nome aleatório</text>
  <text x="274" y="182" text-anchor="middle" font-size="10" fill="#888898">_a1b2.meusite.com.br</text>
  <text x="274" y="196" text-anchor="middle" font-size="10" fill="#888898">→ …acm-validations.aws</text>

  <!-- step 3 -->
  <rect x="372" y="70" width="156" height="150" rx="12" fill="#111118" stroke="#7b61ff" stroke-width="1.5"/>
  <text x="450" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#a78bfa">3. Publicação</text>
  <text x="450" y="124" text-anchor="middle" font-size="11" fill="#f0efe8">o CNAME entra</text>
  <text x="450" y="140" text-anchor="middle" font-size="11" fill="#f0efe8">na zona DNS</text>
  <text x="450" y="156" text-anchor="middle" font-size="11" fill="#f0efe8">do domínio</text>
  <text x="450" y="182" text-anchor="middle" font-size="10" fill="#888898">Route 53: um clique</text>
  <text x="450" y="196" text-anchor="middle" font-size="10" fill="#888898">fora dela: manual</text>

  <!-- step 4 -->
  <rect x="548" y="70" width="156" height="150" rx="12" fill="#111118" stroke="#ffffff14"/>
  <text x="626" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#e8c547">4. Verificação</text>
  <text x="626" y="124" text-anchor="middle" font-size="11" fill="#f0efe8">ACM consulta o DNS</text>
  <text x="626" y="140" text-anchor="middle" font-size="11" fill="#f0efe8">público e acha</text>
  <text x="626" y="156" text-anchor="middle" font-size="11" fill="#f0efe8">o registro</text>
  <text x="626" y="182" text-anchor="middle" font-size="10" fill="#888898">prova de controle</text>
  <text x="626" y="196" text-anchor="middle" font-size="10" fill="#888898">do domínio</text>

  <!-- step 5 -->
  <rect x="724" y="70" width="156" height="150" rx="12" fill="#0f766e" fill-opacity="0.18" stroke="#0f766e" stroke-width="1.5"/>
  <text x="802" y="98" text-anchor="middle" font-size="13" font-weight="700" fill="#2dd4bf">5. Emitido</text>
  <text x="802" y="124" text-anchor="middle" font-size="11" fill="#f0efe8">certificado pronto</text>
  <text x="802" y="140" text-anchor="middle" font-size="11" fill="#f0efe8">para associar ao</text>
  <text x="802" y="156" text-anchor="middle" font-size="11" fill="#f0efe8">CloudFront</text>
  <text x="802" y="182" text-anchor="middle" font-size="10" fill="#888898">status: Issued</text>

  <!-- arrows -->
  <line x1="176" y1="145" x2="192" y2="145" stroke="#888898" stroke-width="1.5" marker-end="url(#acm-val-seta)"/>
  <line x1="352" y1="145" x2="368" y2="145" stroke="#888898" stroke-width="1.5" marker-end="url(#acm-val-seta)"/>
  <line x1="528" y1="145" x2="544" y2="145" stroke="#888898" stroke-width="1.5" marker-end="url(#acm-val-seta)"/>
  <line x1="704" y1="145" x2="720" y2="145" stroke="#888898" stroke-width="1.5" marker-end="url(#acm-val-seta)"/>

  <!-- renewal loop -->
  <path d="M802,224 C802,290 450,290 450,228" fill="none" stroke="#0f766e" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#acm-val-seta)"/>
  <text x="626" y="284" text-anchor="middle" font-size="11" fill="#2dd4bf" paint-order="stroke" stroke="#0a0a0f" stroke-width="4">renovação: o ACM repete a checagem no mesmo CNAME</text>

  <text x="450" y="318" text-anchor="middle" font-size="11" fill="#888898">apague o CNAME de validação e a renovação automática para de funcionar</text>
</svg>
