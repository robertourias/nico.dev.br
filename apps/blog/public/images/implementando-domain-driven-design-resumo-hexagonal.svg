<svg viewBox="0 0 1200 820" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="820" fill="#ffffff"/>
  <rect x="10" y="10" width="1180" height="800" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <text x="600" y="45" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Arquitetura Hexagonal de um Bounded Context</text>
  <text x="600" y="68" text-anchor="middle" font-size="13" fill="#64748b">domínio isolado no centro — portas de entrada/saída — adaptadores plugam a infraestrutura</text>

  <!-- Outer hexagon: adapters ring -->
  <polygon points="600,110 940,230 940,540 600,660 260,540 260,230"
           fill="#eef2ff" stroke="#a5b4fc" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Inner hexagon: domain -->
  <polygon points="600,260 800,335 800,495 600,570 400,495 400,335"
           fill="#0f172a"/>
  <text x="600" y="400" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Domínio</text>
  <text x="600" y="422" text-anchor="middle" font-size="12" fill="#cbd5e1">Entidade · Value Object</text>
  <text x="600" y="440" text-anchor="middle" font-size="12" fill="#cbd5e1">Aggregate · Domain Event</text>
  <text x="600" y="458" text-anchor="middle" font-size="11" fill="#94a3b8">sem dependência de framework</text>

  <!-- Ports (on the inner hexagon edges) -->
  <circle cx="600" cy="260" r="7" fill="#f59e0b"/>
  <text x="600" y="245" text-anchor="middle" font-size="11" fill="#b45309">porta driving</text>

  <circle cx="600" cy="570" r="7" fill="#0891b2"/>
  <text x="600" y="597" text-anchor="middle" font-size="11" fill="#0e7490">porta driven</text>

  <circle cx="800" cy="335" r="7" fill="#0891b2"/>
  <circle cx="400" cy="495" r="7" fill="#0891b2"/>

  <!-- Left adapters: driving side (input) -->
  <rect x="60" y="150" width="180" height="60" rx="10" fill="#4f46e5"/>
  <text x="150" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">REST Controller</text>
  <text x="150" y="194" text-anchor="middle" font-size="11" fill="#e0e7ff">HTTP → Application Service</text>

  <rect x="60" y="230" width="180" height="60" rx="10" fill="#4f46e5"/>
  <text x="150" y="256" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Consumer de fila</text>
  <text x="150" y="274" text-anchor="middle" font-size="11" fill="#e0e7ff">evento externo → comando</text>

  <rect x="60" y="310" width="180" height="60" rx="10" fill="#4f46e5"/>
  <text x="150" y="336" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">CLI / Job agendado</text>
  <text x="150" y="354" text-anchor="middle" font-size="11" fill="#e0e7ff">trigger manual/temporal</text>

  <!-- Right adapters: driven side (output) -->
  <rect x="960" y="150" width="180" height="60" rx="10" fill="#0f766e"/>
  <text x="1050" y="176" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Repository (SQL)</text>
  <text x="1050" y="194" text-anchor="middle" font-size="11" fill="#ccfbf1">persiste o Aggregate Root</text>

  <rect x="960" y="230" width="180" height="60" rx="10" fill="#0f766e"/>
  <text x="1050" y="256" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Publisher de eventos</text>
  <text x="1050" y="274" text-anchor="middle" font-size="11" fill="#ccfbf1">Domain Event → broker</text>

  <rect x="960" y="310" width="180" height="60" rx="10" fill="#0f766e"/>
  <text x="1050" y="336" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Cliente de API externa</text>
  <text x="1050" y="354" text-anchor="middle" font-size="11" fill="#ccfbf1">Anticorruption Layer</text>

  <!-- Application service ring label -->
  <text x="600" y="700" text-anchor="middle" font-size="13" font-weight="600" fill="#4338ca">Application Service — orquestra caso de uso, não contém regra de negócio</text>
  <text x="600" y="722" text-anchor="middle" font-size="12" fill="#64748b">recebe comando → carrega Aggregate via Repository → invoca domínio → persiste → publica evento</text>

  <!-- Arrows: driving adapters -> hexagon -->
  <line x1="240" y1="180" x2="470" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="260" x2="440" y2="360" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="240" y1="340" x2="440" y2="430" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrows: hexagon -> driven adapters -->
  <line x1="730" y1="290" x2="960" y2="180" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="360" x2="960" y2="260" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="430" x2="960" y2="340" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g transform="translate(60,760)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#4f46e5"/>
    <text x="22" y="13" font-size="12" fill="#334155">adaptador driving (entrada)</text>
  </g>
  <g transform="translate(310,760)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#0f766e"/>
    <text x="22" y="13" font-size="12" fill="#334155">adaptador driven (saída)</text>
  </g>
  <g transform="translate(560,760)">
    <rect x="0" y="0" width="16" height="16" rx="3" fill="#0f172a"/>
    <text x="22" y="13" font-size="12" fill="#334155">domínio (núcleo, sem dependência externa)</text>
  </g>
</svg>
