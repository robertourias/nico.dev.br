<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" font-family="'Inter', 'Segoe UI', sans-serif">
  <defs>
    <marker id="arrYellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8c547"/>
    </marker>
  </defs>

  <rect width="800" height="500" fill="#0a0a0f"/>

  <text x="400" y="36" text-anchor="middle" fill="#f0efe8" font-size="20" font-weight="700">Governança leve em quatro camadas</text>
  <text x="400" y="58" text-anchor="middle" fill="#888898" font-size="12">do que foi decidido até o que é medido, com feedback de volta</text>

  <!-- Layer 1 -->
  <rect x="60" y="86" width="580" height="78" rx="14" fill="#111118" stroke="#7b61ff" stroke-width="1.5"/>
  <text x="84" y="114" fill="#a78bfa" font-size="11" font-weight="700">1 · DECISÃO</text>
  <text x="84" y="138" fill="#f0efe8" font-size="15" font-weight="700">ADRs</text>
  <text x="84" y="155" fill="#888898" font-size="11">o que foi decidido, por quê e quais alternativas foram descartadas</text>

  <!-- Layer 2 -->
  <rect x="60" y="176" width="580" height="78" rx="14" fill="#111118" stroke="#ffffff14"/>
  <text x="84" y="204" fill="#888898" font-size="11" font-weight="700">2 · RESPONSABILIDADE</text>
  <text x="84" y="228" fill="#f0efe8" font-size="15" font-weight="700">CODEOWNERS + padrões</text>
  <text x="84" y="245" fill="#888898" font-size="11">quem responde por cada área e qual é o caminho padrão</text>

  <!-- Layer 3 -->
  <rect x="60" y="266" width="580" height="78" rx="14" fill="#111118" stroke="#0f766e" stroke-width="1.5"/>
  <text x="84" y="294" fill="#2dd4bf" font-size="11" font-weight="700">3 · AUTOMAÇÃO</text>
  <text x="84" y="318" fill="#f0efe8" font-size="15" font-weight="700">Guardrails no pipeline</text>
  <text x="84" y="335" fill="#888898" font-size="11">branch protection, lint, testes e checagem de dependências rodam sozinhos</text>

  <!-- Layer 4 -->
  <rect x="60" y="356" width="580" height="78" rx="14" fill="#111118" stroke="#e8c547" stroke-width="1.5"/>
  <text x="84" y="384" fill="#e8c547" font-size="11" font-weight="700">4 · MEDIÇÃO</text>
  <text x="84" y="408" fill="#f0efe8" font-size="15" font-weight="700">Métricas DORA</text>
  <text x="84" y="425" fill="#888898" font-size="11">frequência de deploy, lead time, taxa de falha e tempo de recuperação</text>

  <!-- Feedback loop -->
  <path d="M640 395 L700 395 L700 125 L644 125" fill="none" stroke="#e8c547" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrYellow)"/>
  <text x="716" y="262" fill="#e8c547" font-size="11" font-weight="600" transform="rotate(90 716 262)" text-anchor="middle">feedback: revisar decisões</text>

  <text x="350" y="470" text-anchor="middle" fill="#888898" font-size="12">regra que a máquina verifica dispensa reunião</text>
</svg>
