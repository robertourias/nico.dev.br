<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050508;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#0a0a0f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f1a;stop-opacity:1" />
    </linearGradient>

    <!-- Glow radial para o centro -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" style="stop-color:#e8c54710;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00000000;stop-opacity:1" />
    </radialGradient>

    <!-- Glow roxo lateral -->
    <radialGradient id="purpleGlow" cx="85%" cy="20%" r="40%">
      <stop offset="0%" style="stop-color:#7b61ff18;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00000000;stop-opacity:1" />
    </radialGradient>

    <!-- Grid mask -->
    <mask id="gridMask">
      <rect width="1600" height="900" fill="white"/>
      <linearGradient id="fadeEdges" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" style="stop-color:black"/>
        <stop offset="15%" style="stop-color:white"/>
        <stop offset="85%" style="stop-color:white"/>
        <stop offset="100%" style="stop-color:black"/>
      </linearGradient>
    </mask>

    <!-- Clip para bordas suaves -->
    <clipPath id="clip">
      <rect width="1600" height="900"/>
    </clipPath>

    <filter id="blur-sm">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <filter id="blur-md">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glow-yellow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Base background -->
    <rect width="1600" height="900" fill="url(#bgGrad)"/>
    <rect width="1600" height="900" fill="url(#centerGlow)"/>
    <rect width="1600" height="900" fill="url(#purpleGlow)"/>

    <!-- Grid de pontos — perspectiva convergindo para o centro -->
    <!-- Linhas horizontais -->
    <g opacity="0.12" stroke="#888898" stroke-width="0.5">
      <!-- Grade esparsa -->
      <line x1="0" y1="150" x2="1600" y2="150"/>
      <line x1="0" y1="300" x2="1600" y2="300"/>
      <line x1="0" y1="450" x2="1600" y2="450"/>
      <line x1="0" y1="600" x2="1600" y2="600"/>
      <line x1="0" y1="750" x2="1600" y2="750"/>
      <!-- Verticals -->
      <line x1="200" y1="0" x2="200" y2="900"/>
      <line x1="400" y1="0" x2="400" y2="900"/>
      <line x1="600" y1="0" x2="600" y2="900"/>
      <line x1="800" y1="0" x2="800" y2="900"/>
      <line x1="1000" y1="0" x2="1000" y2="900"/>
      <line x1="1200" y1="0" x2="1200" y2="900"/>
      <line x1="1400" y1="0" x2="1400" y2="900"/>
    </g>

    <!-- Linhas diagonais em perspectiva -->
    <g opacity="0.06" stroke="#e8c547" stroke-width="0.8">
      <!-- Convergindo para ponto de fuga centro-direita -->
      <line x1="0" y1="0" x2="1100" y2="450"/>
      <line x1="0" y1="200" x2="1100" y2="450"/>
      <line x1="0" y1="400" x2="1100" y2="450"/>
      <line x1="0" y1="600" x2="1100" y2="450"/>
      <line x1="0" y1="800" x2="1100" y2="450"/>
      <line x1="0" y1="900" x2="1100" y2="450"/>
      <line x1="1600" y1="0" x2="1100" y2="450"/>
      <line x1="1600" y1="200" x2="1100" y2="450"/>
      <line x1="1600" y1="400" x2="1100" y2="450"/>
      <line x1="1600" y1="600" x2="1100" y2="450"/>
      <line x1="1600" y1="800" x2="1100" y2="450"/>
      <line x1="1600" y1="900" x2="1100" y2="450"/>
    </g>

    <!-- Círculos orbitais abstratos — representam neurônios/redes -->
    <g opacity="0.15" fill="none" stroke="#7b61ff" stroke-width="1">
      <circle cx="1100" cy="450" r="80"/>
      <circle cx="1100" cy="450" r="160"/>
      <circle cx="1100" cy="450" r="260"/>
      <circle cx="1100" cy="450" r="380"/>
    </g>

    <!-- Nós de rede neural (pontos conectados) -->
    <g opacity="0.25">
      <!-- Conexões -->
      <line x1="920" y1="280" x2="1050" y2="360" stroke="#7b61ff" stroke-width="0.8"/>
      <line x1="920" y1="280" x2="1020" y2="440" stroke="#7b61ff" stroke-width="0.8"/>
      <line x1="950" y1="500" x2="1050" y2="360" stroke="#7b61ff" stroke-width="0.8"/>
      <line x1="950" y1="500" x2="1020" y2="440" stroke="#7b61ff" stroke-width="0.8"/>
      <line x1="1050" y1="360" x2="1150" y2="320" stroke="#e8c547" stroke-width="0.8" opacity="0.5"/>
      <line x1="1050" y1="360" x2="1150" y2="420" stroke="#e8c547" stroke-width="0.8" opacity="0.5"/>
      <line x1="1020" y1="440" x2="1150" y2="420" stroke="#e8c547" stroke-width="0.8" opacity="0.5"/>
      <line x1="1020" y1="440" x2="1150" y2="520" stroke="#e8c547" stroke-width="0.8" opacity="0.5"/>
      <line x1="1150" y1="320" x2="1270" y2="350" stroke="#e8c547" stroke-width="0.6" opacity="0.35"/>
      <line x1="1150" y1="420" x2="1270" y2="350" stroke="#e8c547" stroke-width="0.6" opacity="0.35"/>
      <line x1="1150" y1="420" x2="1270" y2="460" stroke="#e8c547" stroke-width="0.6" opacity="0.35"/>
      <line x1="1150" y1="520" x2="1270" y2="460" stroke="#e8c547" stroke-width="0.6" opacity="0.35"/>
      <!-- Nós -->
      <circle cx="920" cy="280" r="5" fill="#7b61ff"/>
      <circle cx="950" cy="500" r="5" fill="#7b61ff"/>
      <circle cx="1050" cy="360" r="6" fill="#7b61ff"/>
      <circle cx="1020" cy="440" r="6" fill="#7b61ff"/>
      <circle cx="1100" cy="450" r="10" fill="#e8c547"/>
      <circle cx="1150" cy="320" r="5" fill="#e8c547" opacity="0.7"/>
      <circle cx="1150" cy="420" r="5" fill="#e8c547" opacity="0.7"/>
      <circle cx="1150" cy="520" r="5" fill="#e8c547" opacity="0.7"/>
      <circle cx="1270" cy="350" r="4" fill="#e8c547" opacity="0.5"/>
      <circle cx="1270" cy="460" r="4" fill="#e8c547" opacity="0.5"/>
    </g>

    <!-- Linha do tempo à esquerda — pilares da história -->
    <g opacity="0.5">
      <line x1="180" y1="180" x2="180" y2="720" stroke="#ffffff14" stroke-width="1.5"/>
      <!-- Pontos marcadores -->
      <circle cx="180" cy="220" r="4" fill="#e8c547"/>
      <circle cx="180" cy="340" r="4" fill="#e8c547" opacity="0.7"/>
      <circle cx="180" cy="460" r="4" fill="#e8c547" opacity="0.7"/>
      <circle cx="180" cy="580" r="4" fill="#e8c547" opacity="0.7"/>
      <circle cx="180" cy="680" r="4" fill="#e8c547" opacity="0.5"/>
      <!-- Labels de anos -->
      <text x="155" y="225" font-family="monospace" font-size="11" fill="#888898" text-anchor="end">1950</text>
      <text x="155" y="345" font-family="monospace" font-size="11" fill="#888898" text-anchor="end">1986</text>
      <text x="155" y="465" font-family="monospace" font-size="11" fill="#888898" text-anchor="end">2012</text>
      <text x="155" y="585" font-family="monospace" font-size="11" fill="#888898" text-anchor="end">2017</text>
      <text x="155" y="685" font-family="monospace" font-size="11" fill="#888898" text-anchor="end">2024</text>
    </g>

    <!-- Overlay escuro nas bordas para dar profundidade -->
    <rect width="1600" height="900" fill="url(#bgGrad)" opacity="0.3"/>

    <!-- Overlay lateral esquerdo para dar espaço ao texto -->
    <rect width="800" height="900" fill="#0a0a0f" opacity="0.5"/>

    <!-- Vinheta geral -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#00000000"/>
      <stop offset="100%" style="stop-color:#000000cc"/>
    </radialGradient>
    <rect width="1600" height="900" fill="url(#vignette)"/>

    <!-- TEXTO PRINCIPAL -->

    <!-- Categoria / eyebrow -->
    <text
      x="220"
      y="340"
      font-family="'Instrument Sans', 'Inter', sans-serif"
      font-size="13"
      font-weight="600"
      letter-spacing="3"
      text-transform="uppercase"
      fill="#e8c547"
      opacity="0.9"
    >INTELIGÊNCIA ARTIFICIAL · HISTÓRIA</text>

    <!-- Título linha 1 -->
    <text
      x="218"
      y="420"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="72"
      font-weight="700"
      fill="#f0efe8"
      opacity="0.97"
    >História da IA</text>

    <!-- Título linha 2 — menor, cor de destaque -->
    <text
      x="220"
      y="490"
      font-family="Georgia, 'Times New Roman', serif"
      font-size="36"
      font-weight="400"
      font-style="italic"
      fill="#888898"
    >Do Mito à Machine Intelligence</text>

    <!-- Linha separadora -->
    <line x1="220" y1="518" x2="580" y2="518" stroke="#e8c547" stroke-width="1.5" opacity="0.6"/>

    <!-- Descrição -->
    <text
      x="220"
      y="552"
      font-family="'Instrument Sans', 'Inter', sans-serif"
      font-size="16"
      fill="#888898"
    >Uma jornada pelos momentos que transformaram</text>
    <text
      x="220"
      y="574"
      font-family="'Instrument Sans', 'Inter', sans-serif"
      font-size="16"
      fill="#888898"
    >sonhos filosóficos em sistemas que pensam.</text>

    <!-- Ponto de destaque no centro da rede -->
    <circle cx="1100" cy="450" r="14" fill="#e8c547" opacity="0.9" filter="url(#glow-yellow)"/>
    <circle cx="1100" cy="450" r="5" fill="#0a0a0f"/>
  </g>
</svg>
