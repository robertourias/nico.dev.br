name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ── 1. Detecta quais apps tiveram alterações ─────────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      web:        ${{ steps.filter.outputs.web }}
      tools:      ${{ steps.filter.outputs.tools }}
      challenges: ${{ steps.filter.outputs.challenges }}
      metronome:  ${{ steps.filter.outputs.metronome }}
      storybook:  ${{ steps.filter.outputs.storybook }}
      blog:       ${{ steps.filter.outputs.blog }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web-nico.dev.br/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
            tools:
              - 'apps/tools/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
            challenges:
              - 'apps/challenges/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
            metronome:
              - 'apps/metronome/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
            storybook:
              - 'apps/storybook/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
            blog:
              - 'apps/blog/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'

  # ── 2. web-nico.dev.br ───────────────────────────────────────────────────
  ci-web:
    name: "web-nico.dev.br — Lint & Build"
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo lint --filter=@nico.dev/web-nico.dev.br

      - name: Build
        run: pnpm turbo build --filter=@nico.dev/web-nico.dev.br

  # ── 3. tools.nico.dev ───────────────────────────────────────────────────
  ci-tools:
    name: "tools — Lint & Build"
    needs: detect-changes
    if: needs.detect-changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo lint --filter=@nico.dev/tools

      - name: Build
        run: pnpm turbo build --filter=@nico.dev/tools


  # ── 4. challenges.nico.dev ──────────────────────────────────────────────
  ci-challenges:
    name: "challenges — Lint & Build"
    needs: detect-changes
    if: needs.detect-changes.outputs.challenges == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo lint --filter=@nico.dev/challenges

      - name: Build
        run: pnpm turbo build --filter=@nico.dev/challenges


  # ── 5. metronome.nico.dev ───────────────────────────────────────────────
  ci-metronome:
    name: "metronome — Lint & Build"
    needs: detect-changes
    if: needs.detect-changes.outputs.metronome == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo lint --filter=@nico.dev/metronome

      - name: Build
        run: pnpm turbo build --filter=@nico.dev/metronome


  # ── 6. storybook ────────────────────────────────────────────────────────
  ci-storybook:
    name: "storybook — Lint & Build"
    needs: detect-changes
    if: needs.detect-changes.outputs.storybook == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo lint --filter=@nico.dev/storybook

      - name: Build
        run: pnpm turbo build --filter=@nico.dev/storybook


  # ── 7. blog.nico.dev.br ─────────────────────────────────────────────────
  ci-blog:
    name: "blog — Lint & Build"
    needs: detect-changes
    if: needs.detect-changes.outputs.blog == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo lint --filter=@nico.dev/blog

      - name: Build
        run: pnpm turbo build --filter=@nico.dev/blog

